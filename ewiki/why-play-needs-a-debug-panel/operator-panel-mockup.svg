<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="system-ui, 'Segoe UI', sans-serif">
  <!-- Hand-authored mockup: the operator panel on play (WP-804 read-only board + WP-807 Tweakpane setters), staged as the D-24686 empty-Wound-supply setup. Illustrative, not a screenshot. -->
  <defs>
    <style>
      .muted { fill: #8a8aa0; }
      .text { fill: #e6e6ef; }
      .amber { fill: #ffb347; }
      .head { fill: #d4af37; font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; }
      .dt { fill: #8a8aa0; font-size: 11px; }
      .dd { fill: #e6e6ef; font-size: 11px; }
      .zone { fill: #8a8aa0; font-size: 9px; letter-spacing: 1px; }
      .cardname { fill: #e6e6ef; font-size: 9.5px; }
      .log { font-size: 11.5px; }
      .mono { font-family: 'Roboto Mono', Consolas, 'Courier New', monospace; }
      .tp-label { fill: #bbbcc4; fill-opacity: 0.7; font-size: 10.5px; }
      .tp-value { fill: #bbbcc4; font-size: 10.5px; }
      .tp-btn { fill: #28292e; font-size: 10.5px; }
      .tp-fold { fill: #bbbcc4; font-size: 10.5px; font-weight: 700; }
      .btn-text { fill: #e6e6ef; font-size: 11.5px; }
    </style>
  </defs>

  <rect width="1200" height="880" fill="#0a0a0f"/>

  <!-- ===================== LEFT: the play mat (context) ===================== -->
  <rect x="20" y="20" width="430" height="840" rx="10" fill="#10101a" stroke="#23233a"/>

  <!-- HUD -->
  <text x="36" y="46" font-size="13" class="text">Turn 7 · Player 0 · <tspan class="muted">main</tspan></text>
  <rect x="268" y="31" width="170" height="22" rx="11" fill="#e5484d" fill-opacity="0.15" stroke="#e5484d"/>
  <text x="353" y="46" font-size="10.5" font-weight="700" fill="#ff8a8d" text-anchor="middle" letter-spacing="0.8">OPERATOR · NOT SCORED</text>

  <!-- Scheme + Mastermind -->
  <rect x="36" y="76" width="58" height="82" rx="5" fill="#1f2a1f" stroke="#3d5a3d"/>
  <text x="106" y="94" class="zone">SCHEME</text>
  <text x="106" y="112" font-size="12.5" class="text">Midtown Bank</text>
  <text x="106" y="128" font-size="12.5" class="text">Robbery</text>
  <text x="106" y="148" font-size="11" class="muted">Twists 3</text>

  <rect x="240" y="76" width="58" height="82" rx="5" fill="#2a1f3d" stroke="#d4af37" stroke-opacity="0.6"/>
  <text x="310" y="94" class="zone">MASTERMIND</text>
  <text x="310" y="112" font-size="12.5" class="text">Loki</text>
  <text x="310" y="148" font-size="11" class="muted">Tactics 3 left</text>

  <!-- City -->
  <text x="36" y="186" class="zone">CITY</text>
  <g>
    <rect x="36" y="194" width="76" height="92" rx="5" fill="none" stroke="#2e2e48" stroke-dasharray="4 3"/>
    <text x="74" y="208" class="zone" text-anchor="middle">SEWERS</text>
    <rect x="118" y="194" width="76" height="92" rx="5" fill="none" stroke="#2e2e48" stroke-dasharray="4 3"/>
    <text x="156" y="208" class="zone" text-anchor="middle">BANK</text>
    <rect x="124" y="214" width="64" height="66" rx="4" fill="#2a1f3d" stroke="#6b4fa0"/>
    <text x="156" y="244" class="cardname" text-anchor="middle">Frost</text>
    <text x="156" y="256" class="cardname" text-anchor="middle">Giant</text>
    <rect x="200" y="194" width="76" height="92" rx="5" fill="none" stroke="#2e2e48" stroke-dasharray="4 3"/>
    <text x="238" y="208" class="zone" text-anchor="middle">ROOFTOPS</text>
    <rect x="282" y="194" width="76" height="92" rx="5" fill="none" stroke="#2e2e48" stroke-dasharray="4 3"/>
    <text x="320" y="208" class="zone" text-anchor="middle">STREETS</text>
    <rect x="288" y="214" width="64" height="66" rx="4" fill="#2a1f3d" stroke="#6b4fa0"/>
    <text x="320" y="250" class="cardname" text-anchor="middle">Enchantress</text>
    <rect x="364" y="194" width="76" height="92" rx="5" fill="none" stroke="#2e2e48" stroke-dasharray="4 3"/>
    <text x="402" y="208" class="zone" text-anchor="middle">BRIDGE</text>
  </g>

  <!-- HQ -->
  <text x="36" y="312" class="zone">HQ</text>
  <g>
    <rect x="36" y="320" width="76" height="84" rx="5" fill="#1d2a3a" stroke="#3a5a7a"/>
    <text x="74" y="366" class="cardname" text-anchor="middle">Hulk</text>
    <rect x="118" y="320" width="76" height="84" rx="5" fill="#1d2a3a" stroke="#3a5a7a"/>
    <text x="156" y="366" class="cardname" text-anchor="middle">Storm</text>
    <rect x="200" y="320" width="76" height="84" rx="5" fill="#1d2a3a" stroke="#3a5a7a"/>
    <text x="238" y="366" class="cardname" text-anchor="middle">Iron Man</text>
    <rect x="282" y="320" width="76" height="84" rx="5" fill="#1d2a3a" stroke="#3a5a7a"/>
    <text x="320" y="366" class="cardname" text-anchor="middle">Black Widow</text>
    <rect x="364" y="320" width="76" height="84" rx="5" fill="#1d2a3a" stroke="#3a5a7a"/>
    <text x="402" y="366" class="cardname" text-anchor="middle">Cyclops</text>
  </g>

  <!-- Hand -->
  <text x="36" y="430" class="zone">YOUR HAND</text>
  <g>
    <rect x="36" y="438" width="66" height="76" rx="5" fill="#1a1a28" stroke="#3a3a55"/>
    <text x="69" y="474" class="cardname" text-anchor="middle">S.H.I.E.L.D.</text>
    <text x="69" y="486" class="cardname" text-anchor="middle">Agent</text>
    <rect x="108" y="438" width="66" height="76" rx="5" fill="#1a1a28" stroke="#3a3a55"/>
    <text x="141" y="474" class="cardname" text-anchor="middle">S.H.I.E.L.D.</text>
    <text x="141" y="486" class="cardname" text-anchor="middle">Trooper</text>
    <rect x="180" y="438" width="66" height="76" rx="5" fill="#1d2a3a" stroke="#3a5a7a"/>
    <text x="213" y="480" class="cardname" text-anchor="middle">Wolverine</text>
    <rect x="252" y="438" width="66" height="76" rx="5" fill="#1d2a3a" stroke="#3a5a7a"/>
    <text x="285" y="480" class="cardname" text-anchor="middle">Hulk</text>
    <rect x="324" y="438" width="66" height="76" rx="5" fill="#1d2a3a" stroke="#3a5a7a"/>
    <text x="357" y="480" class="cardname" text-anchor="middle">Storm</text>
  </g>

  <!-- Game log -->
  <rect x="36" y="534" width="404" height="310" rx="6" fill="#0c0c14" stroke="#23233a"/>
  <text x="50" y="554" class="zone">GAME LOG</text>
  <text x="50" y="580" class="log muted">Turn 7 · Player 0's turn begins.</text>
  <text x="50" y="600" class="log muted">Player 0 drew 6 cards.</text>
  <rect x="44" y="611" width="388" height="62" rx="4" fill="#ffb347" fill-opacity="0.08"/>
  <text x="50" y="628" class="log amber">Operator: Wound supply set to 0 (24 set aside).</text>
  <text x="50" y="646" class="log amber">Operator: Ymir, Frost Giant King moved to the top</text>
  <text x="50" y="662" class="log amber">of the villain deck.</text>
  <text x="50" y="690" class="log text">Player 0 played S.H.I.E.L.D. Agent.</text>
  <text x="50" y="738" class="log muted" font-style="italic">Every setter is an ordinary move: it is in the</text>
  <text x="50" y="754" class="log muted" font-style="italic">replay log and writes an "Operator:" line every</text>
  <text x="50" y="770" class="log muted" font-style="italic">seat sees.</text>

  <!-- ===================== RIGHT: the operator panel ===================== -->
  <rect x="466" y="20" width="714" height="840" rx="10" fill="#12121c" stroke="#3a3a55"/>

  <!-- Header (WP-804) -->
  <rect x="480" y="31" width="140" height="24" rx="5" fill="#1d1d2e" stroke="#4a4a6a"/>
  <text x="492" y="47" class="btn-text" font-weight="700">▾ Operator board</text>
  <rect x="630" y="31" width="70" height="24" rx="5" fill="#1d1d2e" stroke="#4a4a6a"/>
  <text x="665" y="47" class="btn-text" text-anchor="middle">Refresh</text>
  <rect x="708" y="31" width="198" height="24" rx="5" fill="#1d1d2e" stroke="#4a4a6a"/>
  <text x="807" y="47" class="btn-text" text-anchor="middle">Download operator snapshot</text>
  <rect x="914" y="31" width="146" height="24" rx="5" fill="#1d1d2e" stroke="#4a4a6a"/>
  <text x="987" y="47" class="btn-text" text-anchor="middle">Download as fixture</text>
  <line x1="466" y1="66" x2="1180" y2="66" stroke="#2a2a3e"/>
  <line x1="824" y1="76" x2="824" y2="850" stroke="#2a2a3e"/>

  <!-- Read-only board column -->
  <!-- Seats -->
  <text x="480" y="88" class="head">SEATS</text>
  <text x="480" y="108" font-size="12" font-weight="700" class="text">Seat 0 <tspan class="muted" font-weight="400">· you</tspan></text>
  <text x="480" y="126" class="dt">Hand</text><text x="568" y="126" class="dd">Agent, Trooper, Wolverine, Hulk, Storm</text>
  <text x="480" y="142" class="dt">Deck (top first)</text><text x="568" y="142" class="dd">Wound, Agent, Trooper, Agent, … (+4)</text>
  <text x="480" y="158" class="dt">Discard</text><text x="568" y="158" class="dd">Wound, Wound, Trooper, Cyclops</text>
  <text x="480" y="174" class="dt">In play</text><text x="568" y="174" class="dd">Agent</text>
  <text x="480" y="190" class="dt">Victory</text><text x="568" y="190" class="dd">Hand Ninjas, Bystander</text>
  <text x="480" y="206" class="dt">Wounds</text><text x="568" y="206" class="dd">deck 1 · <tspan class="amber" font-weight="700">hand 0 · discard 2</tspan> · in play 0 · victory 0</text>

  <text x="480" y="232" font-size="12" font-weight="700" class="text">Seat 1 <tspan class="muted" font-weight="400">· bot ally</tspan></text>
  <text x="480" y="250" class="dt">Hand</text><text x="568" y="250" class="dd">Wound, Agent, Trooper, Iron Man, Agent, Rogue</text>
  <text x="480" y="266" class="dt">Deck (top first)</text><text x="568" y="266" class="dd">Agent, Wound, Trooper, Wound, … (+2)</text>
  <text x="480" y="282" class="dt">Discard</text><text x="568" y="282" class="dd muted">—</text>
  <text x="480" y="298" class="dt">In play</text><text x="568" y="298" class="dd muted">—</text>
  <text x="480" y="314" class="dt">Victory</text><text x="568" y="314" class="dd">Frost Giant, Bystander, Bystander</text>
  <text x="480" y="330" class="dt">Wounds</text><text x="568" y="330" class="dd">deck 2 · <tspan class="amber" font-weight="700">hand 1 · discard 0</tspan> · in play 0 · victory 0</text>

  <line x1="480" y1="346" x2="810" y2="346" stroke="#2a2a3e"/>

  <!-- Decks -->
  <text x="480" y="366" class="head">DECKS (TOP FIRST)</text>
  <text x="480" y="386" class="dt">Villain deck</text><text x="568" y="386" class="dd"><tspan class="amber" font-weight="700">Ymir, Frost Giant King</tspan>, Bystander,</text>
  <text x="568" y="400" class="dd">Scheme Twist, Frost Giant, … (+18)</text>
  <text x="480" y="418" class="dt">Hero deck</text><text x="568" y="418" class="dd">Spider-Man, Thor, Rogue, … (+61)</text>
  <text x="480" y="436" class="dt">Tactics</text><text x="568" y="436" class="dd">Maniacal Tyrant, Vanishing Illusions,</text>
  <text x="568" y="450" class="dd">Whispers and Lies</text>

  <line x1="480" y1="464" x2="810" y2="464" stroke="#2a2a3e"/>

  <!-- Piles -->
  <text x="480" y="484" class="head">PILES</text>
  <text x="480" y="504" class="dt">Supplies</text><text x="568" y="504" class="dd"><tspan class="amber" font-weight="700">wounds 0</tspan> · bystanders 27 · officers 30 · sidekicks 0</text>
  <text x="480" y="522" class="dd amber">Set aside — Wounds 24, Bystanders 0, Officers 0, Sidekicks 0</text>
  <text x="480" y="540" class="dt">KO</text><text x="568" y="540" class="dd">Wound, Agent, Trooper</text>
  <text x="480" y="556" class="dt">Escaped</text><text x="568" y="556" class="dd">Frost Giant</text>

  <line x1="480" y1="570" x2="810" y2="570" stroke="#2a2a3e"/>

  <!-- Engine -->
  <text x="480" y="590" class="head">ENGINE</text>
  <text x="480" y="608" class="dd">Stage: <tspan font-weight="700">main</tspan></text>
  <text x="480" y="624" class="dd mono" font-size="10.5">escapedVillains: 1 · schemeLoss: 0</text>
  <text x="480" y="638" class="dd mono" font-size="10.5">mastermindDefeated: 0</text>
  <text x="480" y="656" font-size="11" font-weight="700" class="text">Recent effect traces</text>
  <text x="480" y="672" class="dd">1. S.H.I.E.L.D. Agent — <tspan fill="#4caf50">fired</tspan></text>

  <line x1="480" y1="688" x2="810" y2="688" stroke="#2a2a3e"/>

  <!-- Bot decisions -->
  <text x="480" y="708" class="head">BOT DECISIONS (NEWEST FIRST)</text>
  <text x="480" y="728" class="dd"><tspan fill="#d4af37" font-weight="700">Turn 6</tspan> · seat 1 · forced · endTurn · 1 legal</text>
  <text x="480" y="754" class="dd"><tspan fill="#d4af37" font-weight="700">Turn 6</tspan> · seat 1 · policy · fightVillain · 9 legal</text>
  <text x="492" y="770" class="dd mono muted" font-size="10">[Bot] Chose: fightVillain[1] (score 41)</text>
  <text x="492" y="784" class="dd mono muted" font-size="10">[Bot] Over: recruitHero[2] (33), fightMastermind (28)</text>
  <text x="480" y="810" class="dd"><tspan fill="#d4af37" font-weight="700">Turn 6</tspan> · seat 1 · policy · recruitHero · 7 legal</text>
  <text x="492" y="826" class="dd mono muted" font-size="10">[Bot] Chose: recruitHero[3] (score 36)</text>
  <text x="492" y="840" class="dd mono muted" font-size="10">[Bot] Over: recruitHero[0] (31)</text>

  <!-- Tweakpane setters column (WP-807) -->
  <text x="838" y="88" class="head">SETTERS</text>
  <text x="838" y="106" font-size="10.5" class="muted" font-style="italic">Setters change the board through the engine.</text>
  <text x="838" y="120" font-size="10.5" class="muted" font-style="italic">A refused setter changes nothing.</text>

  <g class="mono">
    <rect x="838" y="130" width="328" height="482" rx="6" fill="#28292e"/>
    <!-- pane title -->
    <rect x="838" y="130" width="328" height="24" rx="6" fill="#bbbcc4" fill-opacity="0.10"/>
    <text x="1002" y="146" class="tp-value" text-anchor="middle">Setters</text>

    <!-- 1. Supply -->
    <rect x="842" y="160" width="320" height="22" rx="2" fill="#bbbcc4" fill-opacity="0.06"/>
    <text x="850" y="175" class="tp-fold">Supply</text><text x="1152" y="175" class="tp-value" text-anchor="end">▾</text>
    <text x="852" y="200" class="tp-label">Pile</text>
    <rect x="944" y="188" width="212" height="20" rx="2" fill="#bbbcc4" fill-opacity="0.10"/>
    <text x="950" y="202" class="tp-value">Wound</text><text x="1150" y="202" class="tp-value" text-anchor="end">▾</text>
    <text x="852" y="226" class="tp-label">Count</text>
    <rect x="944" y="214" width="212" height="20" rx="2" fill="#bbbcc4" fill-opacity="0.10"/>
    <text x="950" y="228" class="tp-value">0</text>
    <rect x="852" y="240" width="304" height="20" rx="2" fill="#adafb8"/>
    <text x="1004" y="254" class="tp-btn" text-anchor="middle">Set supply count</text>

    <!-- 2. Villain deck -->
    <rect x="842" y="268" width="320" height="22" rx="2" fill="#bbbcc4" fill-opacity="0.06"/>
    <text x="850" y="283" class="tp-fold">Villain deck</text><text x="1152" y="283" class="tp-value" text-anchor="end">▾</text>
    <text x="852" y="308" class="tp-label">Villain card</text>
    <rect x="944" y="296" width="212" height="20" rx="2" fill="#bbbcc4" fill-opacity="0.10"/>
    <text x="950" y="310" class="tp-value">1. Ymir, Frost Giant King</text><text x="1150" y="310" class="tp-value" text-anchor="end">▾</text>
    <rect x="852" y="322" width="304" height="20" rx="2" fill="#adafb8"/>
    <text x="1004" y="336" class="tp-btn" text-anchor="middle">Move villain card to top</text>
    <rect x="852" y="348" width="304" height="20" rx="2" fill="#adafb8"/>
    <text x="1004" y="362" class="tp-btn" text-anchor="middle">Reveal a Scheme Twist now</text>
    <rect x="852" y="374" width="304" height="20" rx="2" fill="#adafb8"/>
    <text x="1004" y="388" class="tp-btn" text-anchor="middle">Reveal a Master Strike now</text>

    <!-- 3. Hero deck (collapsed) -->
    <rect x="842" y="402" width="320" height="22" rx="2" fill="#bbbcc4" fill-opacity="0.06"/>
    <text x="850" y="417" class="tp-fold">Hero deck</text><text x="1152" y="417" class="tp-value" text-anchor="end">▸</text>

    <!-- 4. Move a card -->
    <rect x="842" y="430" width="320" height="22" rx="2" fill="#bbbcc4" fill-opacity="0.06"/>
    <text x="850" y="445" class="tp-fold">Move a card</text><text x="1152" y="445" class="tp-value" text-anchor="end">▾</text>
    <text x="852" y="470" class="tp-label">Card</text>
    <rect x="944" y="458" width="212" height="20" rx="2" fill="#bbbcc4" fill-opacity="0.10"/>
    <text x="950" y="472" class="tp-value">Player 1 · deck · Wound</text><text x="1150" y="472" class="tp-value" text-anchor="end">▾</text>
    <text x="852" y="496" class="tp-label">Destination</text>
    <rect x="944" y="484" width="212" height="20" rx="2" fill="#bbbcc4" fill-opacity="0.10"/>
    <text x="950" y="498" class="tp-value">Player 1 · discard pile</text><text x="1150" y="498" class="tp-value" text-anchor="end">▾</text>
    <rect x="852" y="510" width="304" height="20" rx="2" fill="#adafb8"/>
    <text x="1004" y="524" class="tp-btn" text-anchor="middle">Move card</text>

    <!-- 5. Turn economy (collapsed) -->
    <rect x="842" y="538" width="320" height="22" rx="2" fill="#bbbcc4" fill-opacity="0.06"/>
    <text x="850" y="553" class="tp-fold">Turn economy</text><text x="1152" y="553" class="tp-value" text-anchor="end">▸</text>

    <!-- 6. Escape (button disabled: the Bridge is empty) -->
    <rect x="842" y="566" width="320" height="22" rx="2" fill="#bbbcc4" fill-opacity="0.06"/>
    <text x="850" y="581" class="tp-fold">Escape</text><text x="1152" y="581" class="tp-value" text-anchor="end">▾</text>
    <rect x="852" y="592" width="304" height="20" rx="2" fill="#adafb8" fill-opacity="0.35"/>
    <text x="1004" y="606" class="tp-btn" text-anchor="middle" fill-opacity="0.6">Escape the Villain at the City's edge</text>
  </g>

  <!-- Mock annotation (not UI) -->
  <rect x="838" y="634" width="328" height="212" rx="6" fill="none" stroke="#d4af37" stroke-opacity="0.55" stroke-dasharray="5 4"/>
  <text x="852" y="656" font-size="10" font-weight="700" fill="#d4af37" letter-spacing="1">MOCK SCENARIO · D-24686 IN ONE TURN</text>
  <text x="852" y="680" font-size="11" class="text">1. Supply → Wound, 0 → Set supply count.</text>
  <text x="866" y="696" font-size="10.5" class="muted">24 Wounds go to the set-aside zone.</text>
  <text x="866" y="710" font-size="10.5" class="muted">Nothing is destroyed.</text>
  <text x="852" y="734" font-size="11" class="text">2. Villain deck → Ymir → Move to top.</text>
  <text x="852" y="758" font-size="11" class="text">3. End the turn. Ymir is the bot's reveal;</text>
  <text x="866" y="774" font-size="11" class="text">its Ambush has no Wound to give. Read that line.</text>
  <text x="852" y="800" font-size="10.5" class="muted">Hand + discard Wounds are read straight off</text>
  <text x="852" y="814" font-size="10.5" class="muted">the seats: 2 for Seat 0, 1 for the bot. No</text>
  <text x="852" y="828" font-size="10.5" class="muted">extra games to settle the D-24684 chooser.</text>
</svg>
