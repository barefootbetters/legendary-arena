<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="system-ui, 'Segoe UI', sans-serif">
  <!-- Hand-authored mockup: envisioned Hall of Legends board (proposal, not shipped UI). -->
  <defs>
    <linearGradient id="titleGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd700"/>
      <stop offset="1" stop-color="#ff8c00"/>
    </linearGradient>
    <g id="flame">
      <path d="M7 0 C7 5 12 7 12 12 A6 6 0 0 1 0 12 C0 8 4 7 4 3 C5 5 7 4 7 0 Z" fill="#ff8c00"/>
