    </g>
  </defs>

  <rect width="920" height="620" fill="#0a0a0f"/>

  <!-- Header -->
  <text x="40" y="52" font-size="30" font-weight="700" fill="url(#titleGold)" letter-spacing="1">HALL OF LEGENDS</text>
  <rect x="700" y="30" width="180" height="28" rx="14" fill="none" stroke="#1a1a2e"/>
  <circle cx="718" cy="44" r="4" fill="#4caf50"/>
  <text x="730" y="49" font-size="12" fill="#888">Updated 3 min ago</text>

