<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="360" height="330" role="img" aria-label="Animated mock of the long-press slash on a phone: the City row scrolls sideways, so a finger first holds still on a gap while a lavender ring fills; the row arms with an inset lavender glow and the word ARMED gives a small buzz; then the finger drags right, a blade trail follows, and the two villains it fully crosses split along the stroke in order while the row stays put. Loops.">
