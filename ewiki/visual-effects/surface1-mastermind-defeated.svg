<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Animated mock of mastermindDefeated: a full-screen golden victory bloom bursts from the centre with radiating light rays and an expanding shockwave ring, while a storm of colourful confetti falls across the screen. Loops.">
  <title>Surface-1 mastermindDefeated — full-screen victory bloom + confetti storm</title>
  <style>
.bloom { opacity: 0; animation: dbloom 2.6s ease-out infinite; }
.dring { opacity: 0; fill: none; stroke: #fff6cf; animation: dring 2.6s ease-out infinite; }
.rays { opacity: 0.42; animation: drays 15s linear infinite; }
.cf { opacity: 0; animation: dconfetti 2.6s linear infinite; }
@keyframes dbloom {
  0.00% { opacity: 0; transform: translate(320px,180px) scale(0); }
  8.00% { opacity: 1; transform: translate(320px,180px) scale(1.12); }
  16.00% { opacity: 0.95; transform: translate(320px,180px) scale(1.0); }
  58.00% { opacity: 0.82; transform: translate(320px,180px) scale(1.06); }
  88.00% { opacity: 0.72; transform: translate(320px,180px) scale(1.0); }
  96.00% { opacity: 0; transform: translate(320px,180px) scale(1.12); }
  100.00% { opacity: 0; transform: translate(320px,180px) scale(1.12); }
}
@keyframes dring {
  0.00% { opacity: 0; transform: translate(320px,180px) scale(0.2); stroke-width: 6; }
  5.00% { opacity: 0.9; }
  30.00% { opacity: 0; transform: translate(320px,180px) scale(7); stroke-width: 1; }
  100.00% { opacity: 0; transform: translate(320px,180px) scale(7); stroke-width: 1; }
}
@keyframes drays {
  0.00% { transform: translate(320px,180px) rotate(0deg); }
  100.00% { transform: translate(320px,180px) rotate(360deg); }
}
@keyframes dconfetti {
  0.00% { opacity: 0; transform: translate(var(--x0), -30px) rotate(0deg); }
  6.00% { opacity: 1; }
  90.00% { opacity: 1; }
  100.00% { opacity: 0; transform: translate(calc(var(--x0) + var(--dx)), 392px) rotate(var(--spin)); }
}
@media (prefers-reduced-motion: reduce) {
  .bloom { animation: none; opacity: 0.9; transform: translate(320px,180px) scale(1); }
  .dring { animation: none; opacity: 0; }
  .rays { animation: none; opacity: 0.42; transform: translate(320px,180px); }
  .cf { animation: none; opacity: 0; }
}
  </style>
