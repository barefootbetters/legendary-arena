<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="460" height="260" role="img" aria-label="Animated mock: an emptied deck slot pulls the discard pile's cards back across, they riffle-shuffle together, and a fresh deck stacks up. A 'Deck Shuffled' banner pulses. Loops.">
  <title>Surface-3 deckReshuffled — discard riffles back into a fresh deck</title>
  <style>
.riffle { opacity: 0; transform: translate(300px,120px); animation: riffle 3s ease-in-out infinite; }
@keyframes riffle {
  0.00%  { opacity: 0; transform: translate(300px,120px) rotate(10deg); }
  10.00% { opacity: 1; transform: translate(300px,120px) rotate(10deg); }
  46.00% { opacity: 1; transform: translate(150px,120px) rotate(0deg); }
  62.00% { opacity: 1; transform: translate(150px,120px) rotate(0deg); }
  78.00% { opacity: 1; transform: translate(150px,120px) rotate(0deg); }
  90.00% { opacity: 0; transform: translate(150px,120px) rotate(-3deg); }
  100.00%{ opacity: 0; transform: translate(300px,120px) rotate(10deg); }
}
.banner { opacity: 0; animation: banner 3s ease-in-out infinite; transform-origin: 230px 44px; }
@keyframes banner {
  0.00%  { opacity: 0; transform: scale(0.9); }
  50.00% { opacity: 0; transform: scale(0.9); }
  62.00% { opacity: 1; transform: scale(1); }
  84.00% { opacity: 1; transform: scale(1); }
  96.00% { opacity: 0; transform: scale(0.98); }
  100.00%{ opacity: 0; transform: scale(0.9); }
}
@media (prefers-reduced-motion: reduce) {
  .riffle { animation: none; opacity: 1; transform: translate(150px,120px) rotate(0deg); }
  .banner { animation: none; opacity: 1; transform: scale(1); }
}
  </style>
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="80%"><stop offset="0%" stop-color="#171320" stop-opacity="1"/><stop offset="100%" stop-color="#0b0910" stop-opacity="1"/></radialGradient>
    <linearGradient id="deckcard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d78d9"/><stop offset="1" stop-color="#3a429e"/></linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#565b70"/><stop offset="1" stop-color="#343850"/></linearGradient>
  </defs>
  <rect width="460" height="260" fill="url(#bg)"/>

  <!-- destination deck (left): the fresh, reshuffled draw pile stacks here -->
  <g transform="translate(120,120)">
    <rect x="-29" y="-41" width="58" height="82" rx="6" fill="url(#deckcard)" stroke="#1c1e28" stroke-width="1.5" opacity="0.35"/>
    <rect x="-26" y="-38" width="58" height="82" rx="6" fill="url(#deckcard)" stroke="#1c1e28" stroke-width="1.5" opacity="0.55"/>
    <rect x="-23" y="-35" width="58" height="82" rx="6" fill="url(#deckcard)" stroke="#1c1e28" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- discard cards (right) riffling back across into the deck, staggered -->
  <g class="riffle" style="animation-delay:0.00s;"><rect x="-29" y="-41" width="58" height="82" rx="6" fill="url(#disc)" stroke="#1c1e28" stroke-width="1.5"/><rect x="-22" y="-34" width="44" height="9" rx="3" fill="#ffffff" opacity="0.14"/></g>
  <g class="riffle" style="animation-delay:0.20s;"><rect x="-29" y="-41" width="58" height="82" rx="6" fill="url(#disc)" stroke="#1c1e28" stroke-width="1.5"/><rect x="-22" y="-34" width="44" height="9" rx="3" fill="#ffffff" opacity="0.14"/></g>
  <g class="riffle" style="animation-delay:0.40s;"><rect x="-29" y="-41" width="58" height="82" rx="6" fill="url(#disc)" stroke="#1c1e28" stroke-width="1.5"/><rect x="-22" y="-34" width="44" height="9" rx="3" fill="#ffffff" opacity="0.14"/></g>
  <g class="riffle" style="animation-delay:0.60s;"><rect x="-29" y="-41" width="58" height="82" rx="6" fill="url(#deckcard)" stroke="#1c1e28" stroke-width="1.5"/><rect x="-22" y="-34" width="44" height="9" rx="3" fill="#ffffff" opacity="0.16"/></g>

  <!-- "Deck Shuffled" banner pulses once the riffle completes (the notable-event chip) -->
  <g class="banner">
    <rect x="150" y="26" width="160" height="34" rx="17" fill="#6d78d9" opacity="0.18" stroke="#6d78d9" stroke-width="1.5"/>
    <text x="230" y="48" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="0.5" fill="#c7ccf5">DECK SHUFFLED</text>
  </g>
</svg>
