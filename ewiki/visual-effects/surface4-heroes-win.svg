<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Animated mock of the heroes-win finale: a full-screen golden victory bloom with rotating rays, a slow light sweep, and a storm of colourful confetti. Loops.">
  <title>Surface-4 heroes-win — victory bloom finale</title>
  <style>
.bloom { opacity: 0; animation: hbloom 3.0s ease-out infinite; }
.rays { opacity: 0.44; animation: hrays 16s linear infinite; }
.cf { opacity: 0; animation: hcf 3.0s linear infinite; }
.shine { opacity: 0; animation: hshine 3.0s ease-in-out infinite; }
@keyframes hbloom {
  0.00% { opacity: 0; transform: translate(320px,180px) scale(0.2); }
  8.00% { opacity: 1; transform: translate(320px,180px) scale(1.12); }
  16.00% { opacity: 0.92; transform: translate(320px,180px) scale(1.0); }
  55.00% { opacity: 0.85; transform: translate(320px,180px) scale(1.06); }
  86.00% { opacity: 0.8; transform: translate(320px,180px) scale(1.0); }
  95.00% { opacity: 0; transform: translate(320px,180px) scale(1.1); }
  100.00% { opacity: 0; transform: translate(320px,180px) scale(1.1); }
}
@keyframes hrays {
  0.00% { transform: translate(320px,180px) rotate(0deg); }
  100.00% { transform: translate(320px,180px) rotate(360deg); }
}
@keyframes hcf {
  0.00% { opacity: 0; transform: translate(var(--x0), -30px) rotate(0deg); }
  6.00% { opacity: 1; }
  90.00% { opacity: 1; }
  100.00% { opacity: 0; transform: translate(calc(var(--x0) + var(--dx)), 392px) rotate(var(--spin)); }
}
@keyframes hshine {
  0.00% { opacity: 0; transform: translate(-460px,0) rotate(18deg); }
  22.00% { opacity: 0; transform: translate(-460px,0) rotate(18deg); }
  30.00% { opacity: 0.5; }
  55.00% { opacity: 0.6; transform: translate(0px,0) rotate(18deg); }
  80.00% { opacity: 0; transform: translate(460px,0) rotate(18deg); }
  100.00% { opacity: 0; transform: translate(460px,0) rotate(18deg); }
}
@media (prefers-reduced-motion: reduce) {
  .bloom { animation: none; opacity: 0.9; transform: translate(320px,180px) scale(1); }
  .rays { animation: none; opacity: 0.44; transform: translate(320px,180px); }
  .cf, .shine { animation: none; opacity: 0; }
}
  </style>
