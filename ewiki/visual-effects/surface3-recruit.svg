<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="460" height="260" role="img" aria-label="Animated mock: a hero card in an HQ slot glows gold, then is pulled down into the hand, and the cycle repeats. Loops.">
  <title>Surface-3 recruitHero — HQ-slot glow pulls to hand</title>
  <style>
.recruit { animation: recruit 2.4s ease-in-out infinite; }
.rglow { opacity: 0; animation: rglow 2.4s ease-in-out infinite; }
@keyframes recruit {
  0.00% { opacity: 1; transform: translate(250px,52px) scale(0.96); }
  14.00% { transform: translate(250px,52px) scale(1.08); }
  44.00% { opacity: 1; transform: translate(300px,208px) scale(1.0); }
  82.00% { opacity: 1; transform: translate(300px,208px) scale(1.0); }
  90.00% { opacity: 0; transform: translate(300px,208px) scale(1.0); }
  91.00% { opacity: 0; transform: translate(250px,52px) scale(0.96); }
  100.00% { opacity: 1; transform: translate(250px,52px) scale(0.96); }
}
@keyframes rglow {
  0.00% { opacity: 0.25; }
  12.00% { opacity: 0.8; }
  44.00% { opacity: 0.5; }
  80.00% { opacity: 0.2; }
  89.00% { opacity: 0; }
  90.00% { opacity: 0; }
  100.00% { opacity: 0.25; }
}
@media (prefers-reduced-motion: reduce) {
  .recruit { animation: none; transform: translate(300px,208px) scale(1); }
  .rglow { animation: none; opacity: 0.15; }
}
  </style>
  <defs><radialGradient id="bg" cx="50%" cy="46%" r="80%"><stop offset="0%" stop-color="#171320" stop-opacity="1"/><stop offset="100%" stop-color="#0b0910" stop-opacity="1"/></radialGradient><linearGradient id="hero" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a7fc9"/><stop offset="1" stop-color="#2b4d80"/></linearGradient><linearGradient id="vill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b34a4a"/><stop offset="1" stop-color="#7a2828"/></linearGradient><linearGradient id="gen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#565b70"/><stop offset="1" stop-color="#343850"/></linearGradient><radialGradient id="gl" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffe6a0" stop-opacity="0.95"/><stop offset="100%" stop-color="#ffb020" stop-opacity="0"/></radialGradient></defs>
  <rect width="460" height="260" fill="url(#bg)"/>
