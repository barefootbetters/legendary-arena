<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="Animated mock of the tier-3 combo cue: a full-screen golden bloom with rotating rays and ascending streaks of light rising up the screen as the word Unstoppable! pops, then loops.">
  <title>Surface-2 combo T3 — ascending flourish + Unstoppable!</title>
  <style>
text { font-family: 'Arial Black','Helvetica Neue',Arial,sans-serif; font-weight: 900; font-style: italic; letter-spacing: 1px; }
.bloom { opacity: 0; animation: bloom 2.4s ease-out infinite; }
.rays { opacity: 0.36; animation: rays 14s linear infinite; }
.fs { opacity: 0; animation: fs 2.4s linear infinite; }
.lbl { opacity: 0; animation: lbl 2.4s ease-out infinite; }
@keyframes bloom {
  0.00% { opacity: 0; transform: translate(320px,170px) scale(0.2); }
  12.00% { opacity: 0; transform: translate(320px,170px) scale(0.3); }
  16.00% { opacity: 0.9; transform: translate(320px,170px) scale(1.05); }
  60.00% { opacity: 0.7; transform: translate(320px,170px) scale(1.0); }
  88.00% { opacity: 0; transform: translate(320px,170px) scale(1.1); }
  100.00% { opacity: 0; transform: translate(320px,170px) scale(1.1); }
}
@keyframes rays {
  0.00% { transform: translate(320px,170px) rotate(0deg); }
  100.00% { transform: translate(320px,170px) rotate(360deg); }
}
@keyframes fs {
  0.00% { opacity: 0; transform: translate(var(--x0), 0px); }
  8.00% { opacity: 1; }
  86.00% { opacity: 0.7; }
  100.00% { opacity: 0; transform: translate(calc(var(--x0) + var(--dx)), var(--up)); }
}
@keyframes lbl {
  0.00% { opacity: 0; transform: translate(320px,170px) scale(0.4); }
  12.00% { opacity: 0; transform: translate(320px,170px) scale(0.4); }
  14.00% { opacity: 1; transform: translate(320px,170px) scale(1.16); }
  16.00% { transform: translate(320px,170px) scale(1.0); }
  82.00% { opacity: 1; transform: translate(320px,170px) scale(1.0); }
  92.00% { opacity: 0; transform: translate(320px,170px) scale(1.2); }
  100.00% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .bloom { animation: none; opacity: 0.8; transform: translate(320px,170px) scale(1); }
  .rays { animation: none; opacity: 0.36; transform: translate(320px,170px); }
  .fs { animation: none; opacity: 0; }
  .lbl { animation: none; opacity: 1; transform: translate(320px,170px) scale(1); }
}
  </style>
  <defs><radialGradient id="bg" cx="50%" cy="48%" r="80%"><stop offset="0%" stop-color="#171320" stop-opacity="1"/><stop offset="100%" stop-color="#0b0910" stop-opacity="1"/></radialGradient><radialGradient id="bl" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffffff" stop-opacity="1"/><stop offset="38%" stop-color="#ffe9a8" stop-opacity="0.9"/><stop offset="72%" stop-color="#ffb24a" stop-opacity="0.5"/><stop offset="100%" stop-color="#ff8a1e" stop-opacity="0"/></radialGradient></defs>
  <rect width="640" height="340" fill="url(#bg)"/>
  <g class="rays"><polygon points="0,0 360,-8 360,8" fill="#ffdf7a" transform="rotate(0)"/><polygon points="0,0 360,-8 360,8" fill="#ffdf7a" transform="rotate(24)"/><polygon points="0,0 360,-8 360,8" fill="#ffdf7a" transform="rotate(48)"/><polygon points="0,0 360,-8 360,8" fill="#ffdf7a" transform="rotate(72)"/><polygon points="0,0 360,-8 360,8" fill="#ffdf7a" transform="rotate(96)"/><polygon points="0,0 360,-8 360,8" fill="#ffdf7a" transform="rotate(120)"/><polygon points="0,0 360,-8 360,8" fill="#ffdf7a" transform="rotate(144)"/><polygon points="0,0 360,-8 360,8" fill="#ffdf7a" transform="rotate(168)"/><polygon points="0,0 360,-8 360,8" fill="#ffdf7a" transform="rotate(192)"/><polygon points="0,0 360,-8 360,8" fill="#ffdf7a" transform="rotate(216)"/><polygon points="0,0 360,-8 360,8" fill="#ffdf7a" transform="rotate(240)"/><polygon points="0,0 360,-8 360,8" fill="#ffdf7a" transform="rotate(264)"/><polygon points="0,0 360,-8 360,8" fill="#ffdf7a" transform="rotate(288)"/><polygon points="0,0 360,-8 360,8" fill="#ffdf7a" transform="rotate(312)"/><polygon points="0,0 360,-8 360,8" fill="#ffdf7a" transform="rotate(336)"/></g><circle class="bloom" r="150" fill="url(#bl)"/><g class="fs" style="--x0:542px; --dx:-12px; --up:-201px; animation-delay:-0.71s;" transform="translate(0 350)"><rect x="-2" y="-13" width="4" height="13" rx="2" fill="#ffd24a"/></g><g class="fs" style="--x0:515px; --dx:-21px; --up:-244px; animation-delay:-0.34s;" transform="translate(0 350)"><rect x="-2" y="-12" width="4" height="12" rx="2" fill="#ff9a3c"/></g><g class="fs" style="--x0:210px; --dx:18px; --up:-209px; animation-delay:-1.91s;" transform="translate(0 350)"><rect x="-2" y="-15" width="4" height="15" rx="2" fill="#ffe9a8"/></g><g class="fs" style="--x0:335px; --dx:-29px; --up:-358px; animation-delay:-0.06s;" transform="translate(0 350)"><rect x="-2" y="-25" width="4" height="25" rx="2" fill="#fff"/></g><g class="fs" style="--x0:518px; --dx:6px; --up:-227px; animation-delay:-1.46s;" transform="translate(0 350)"><rect x="-2" y="-12" width="4" height="12" rx="2" fill="#ffd24a"/></g><g class="fs" style="--x0:323px; --dx:-26px; --up:-340px; animation-delay:-0.14s;" transform="translate(0 350)"><rect x="-2" y="-22" width="4" height="22" rx="2" fill="#ff9a3c"/></g><g class="fs" style="--x0:471px; --dx:20px; --up:-344px; animation-delay:-2.01s;" transform="translate(0 350)"><rect x="-2" y="-15" width="4" height="15" rx="2" fill="#ffe9a8"/></g><g class="fs" style="--x0:140px; --dx:18px; --up:-241px; animation-delay:-1.90s;" transform="translate(0 350)"><rect x="-2" y="-27" width="4" height="27" rx="2" fill="#fff"/></g><g class="fs" style="--x0:453px; --dx:-27px; --up:-233px; animation-delay:-0.14s;" transform="translate(0 350)"><rect x="-2" y="-27" width="4" height="27" rx="2" fill="#ffd24a"/></g><g class="fs" style="--x0:501px; --dx:-22px; --up:-286px; animation-delay:-0.32s;" transform="translate(0 350)"><rect x="-2" y="-22" width="4" height="22" rx="2" fill="#ff9a3c"/></g><g class="fs" style="--x0:508px; --dx:-10px; --up:-304px; animation-delay:-0.79s;" transform="translate(0 350)"><rect x="-2" y="-15" width="4" height="15" rx="2" fill="#ffe9a8"/></g><g class="fs" style="--x0:152px; --dx:-9px; --up:-256px; animation-delay:-0.84s;" transform="translate(0 350)"><rect x="-2" y="-13" width="4" height="13" rx="2" fill="#fff"/></g><g class="fs" style="--x0:497px; --dx:-20px; --up:-216px; animation-delay:-0.39s;" transform="translate(0 350)"><rect x="-2" y="-21" width="4" height="21" rx="2" fill="#ffd24a"/></g><g class="fs" style="--x0:341px; --dx:27px; --up:-203px; animation-delay:-2.28s;" transform="translate(0 350)"><rect x="-2" y="-26" width="4" height="26" rx="2" fill="#ff9a3c"/></g><g class="fs" style="--x0:480px; --dx:-12px; --up:-345px; animation-delay:-0.73s;" transform="translate(0 350)"><rect x="-2" y="-19" width="4" height="19" rx="2" fill="#ffe9a8"/></g><g class="fs" style="--x0:538px; --dx:-5px; --up:-323px; animation-delay:-0.99s;" transform="translate(0 350)"><rect x="-2" y="-15" width="4" height="15" rx="2" fill="#fff"/></g><text class="lbl" x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="62" fill="#ff9a3c">UNSTOPPABLE!</text>
</svg>
