.drop { opacity: 0; transform-box: fill-box; animation: drops 3.2s ease-out infinite; }
.stain { opacity: 0; animation: stain 3.2s ease-in infinite; }
.lbl { opacity: 0; animation: lbl 3.2s ease-out infinite; }
