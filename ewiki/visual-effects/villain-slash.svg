  86.00% { opacity: 1; transform: translate(230px,310px) scale(1.0); }
  94.00% { opacity: 0; transform: translate(230px,310px) scale(1.1); }
  100.00% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .whole, .streak, .drop { animation: none; opacity: 0; }
  .halfa { animation: none; opacity: 1; transform: translate(170.0px,72.0px) translate(-4.7px,-8.8px); }
  .halfb { animation: none; opacity: 1; transform: translate(170.0px,72.0px) translate(4.7px,8.8px); }
  .stain { animation: none; opacity: 0.7; }
  .lbl { animation: none; opacity: 1; transform: translate(230px,310px) scale(1); }
}
