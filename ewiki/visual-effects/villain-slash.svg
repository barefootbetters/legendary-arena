<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 340" width="460" height="340" role="img" aria-label="Animated mock of the villain slash: a bright blade streak crosses a villain card, the card splits along the cut into two halves that hop and tumble away, purple droplets spray along the cut, stains fade, and the words DOUBLE TAKEDOWN! pop. Loops.">
  <title>Shipped villain slash — every villain or henchman defeat slices the card</title>
  <style>
text { font-family: 'Arial Black','Helvetica Neue',Arial,sans-serif; font-weight: 900; font-style: italic; letter-spacing: 1px; }
.whole { opacity: 0; animation: whole 3.2s linear infinite; }
.halfa { opacity: 0; animation: halfa 3.2s linear infinite; }
.halfb { opacity: 0; animation: halfb 3.2s linear infinite; }
