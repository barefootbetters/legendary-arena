<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="460" height="260" role="img" aria-label="Animated mock: cards deal one after another off a deck and fan out into a hand at the bottom, then reset. Loops.">
  <title>Surface-3 drawCards — deal / fan into the hand</title>
  <style>
.deal { opacity: 0; transform: translate(70px,118px); animation: deal 2.4s ease-out infinite; }
@keyframes deal {
  0.00% { opacity: 0; transform: translate(70px,118px) rotate(-4deg); }
  8.00% { opacity: 1; }
  44.00% { opacity: 1; transform: translate(var(--fx), 206px) rotate(var(--rot)); }
  84.00% { opacity: 1; transform: translate(var(--fx), 206px) rotate(var(--rot)); }
  92.00% { opacity: 0; }
  100.00% { opacity: 0; transform: translate(70px,118px) rotate(-4deg); }
}
@media (prefers-reduced-motion: reduce) {
  .deal { animation: none; opacity: 1; transform: translate(var(--fx),206px) rotate(var(--rot)); }
}
  </style>
