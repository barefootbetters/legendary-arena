<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="460" height="260" role="img" aria-label="Animated mock: a bright slash streak sweeps in from the upper-left and lands on a villain card with an impact burst and recoil, then resets. Loops.">
  <title>Surface-3 fightVillain — slash / impact streak</title>
  <style>
.slash { opacity: 0; animation: slash 2.0s ease-in infinite; }
.fimpact { opacity: 0; animation: fimpact 2.0s ease-out infinite; }
.fshard { opacity: 0; transform: translate(0,0); animation: fshard 2.0s ease-out infinite; }
.vrecoil { animation: vrecoil 2.0s ease-out infinite; }
@keyframes slash {
  0.00% { opacity: 0; transform: translate(-260px,-120px); }
  15.00% { opacity: 0; transform: translate(-260px,-120px); }
  17.00% { opacity: 0.95; }
  22.00% { opacity: 1; transform: translate(0,0); }
  29.00% { opacity: 0; transform: translate(55px,26px); }
  100.00% { opacity: 0; transform: translate(55px,26px); }
}
@keyframes fimpact {
  0.00% { opacity: 0; transform: scale(0); }
  22.00% { opacity: 0; transform: scale(0.3); }
  24.00% { opacity: 0.9; transform: scale(0.6); }
  36.00% { opacity: 0; transform: scale(1.5); }
  100.00% { opacity: 0; transform: scale(1.5); }
}
@keyframes fshard {
  0.00% { opacity: 0; transform: translate(0,0); }
  22.00% { opacity: 0; transform: translate(0,0); }
  24.00% { opacity: 0.9; }
  42.00% { opacity: 0; transform: translate(var(--tx), var(--ty)); }
  100.00% { opacity: 0; transform: translate(var(--tx), var(--ty)); }
}
@keyframes vrecoil {
  0.00% { transform: translate(0,0) rotate(0deg); }
  22.00% { transform: translate(0,0) rotate(0deg); }
  24.00% { transform: translate(9px,0) rotate(3deg); }
  30.00% { transform: translate(-3px,0) rotate(-1deg); }
  36.00% { transform: translate(0,0) rotate(0deg); }
  100.00% { transform: translate(0,0) rotate(0deg); }
}
@media (prefers-reduced-motion: reduce) {
  .slash, .fimpact, .fshard { animation: none; opacity: 0; }
  .vrecoil { animation: none; transform: translate(0,0); }
}
  </style>
  <defs><radialGradient id="bg" cx="50%" cy="46%" r="80%"><stop offset="0%" stop-color="#171320" stop-opacity="1"/><stop offset="100%" stop-color="#0b0910" stop-opacity="1"/></radialGradient><linearGradient id="hero" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a7fc9"/><stop offset="1" stop-color="#2b4d80"/></linearGradient><linearGradient id="vill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b34a4a"/><stop offset="1" stop-color="#7a2828"/></linearGradient><linearGradient id="gen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#565b70"/><stop offset="1" stop-color="#343850"/></linearGradient><radialGradient id="fi" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffffff" stop-opacity="1"/><stop offset="55%" stop-color="#ffb0a0" stop-opacity="0.85"/><stop offset="100%" stop-color="#ff5030" stop-opacity="0"/></radialGradient><linearGradient id="sl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/><stop offset="1" stop-color="#ff6a4a" stop-opacity="0.2"/></linearGradient></defs>
  <rect width="460" height="260" fill="url(#bg)"/>
  <g class="vrecoil" transform="translate(350 130)"><rect x="-29" y="-41" width="58" height="82" rx="6" fill="url(#vill)" stroke="#1c1e28" stroke-width="1.5"/><rect x="-22" y="-34" width="44" height="9" rx="3" fill="#ffffff" opacity="0.16"/><circle cx="0" cy="6" r="12" fill="#ffffff" opacity="0.10"/></g><g transform="translate(350 130)"><circle class="fimpact" r="46" fill="url(#fi)"/><g class="fshard" style="--tx:70px; --ty:13px;"><polygon points="13,0 -5,4 -5,-4" fill="#ffd0c0" transform="rotate(11)"/></g><g class="fshard" style="--tx:52px; --ty:49px;"><polygon points="13,0 -5,4 -5,-4" fill="#ffd0c0" transform="rotate(43)"/></g><g class="fshard" style="--tx:28px; --ty:57px;"><polygon points="11,0 -5,3 -5,-3" fill="#ffd0c0" transform="rotate(64)"/></g><g class="fshard" style="--tx:-18px; --ty:52px;"><polygon points="10,0 -4,3 -4,-3" fill="#ffd0c0" transform="rotate(109)"/></g><g class="fshard" style="--tx:-58px; --ty:8px;"><polygon points="10,0 -4,3 -4,-3" fill="#ffd0c0" transform="rotate(172)"/></g><g class="fshard" style="--tx:-47px; --ty:-36px;"><polygon points="10,0 -4,3 -4,-3" fill="#ffd0c0" transform="rotate(217)"/></g><g class="fshard" style="--tx:-26px; --ty:-45px;"><polygon points="9,0 -4,3 -4,-3" fill="#ffd0c0" transform="rotate(240)"/></g><g class="fshard" style="--tx:9px; --ty:-48px;"><polygon points="8,0 -3,3 -3,-3" fill="#ffd0c0" transform="rotate(281)"/></g><g class="fshard" style="--tx:38px; --ty:-25px;"><polygon points="8,0 -3,2 -3,-2" fill="#ffd0c0" transform="rotate(327)"/></g><g class="slash"><rect x="-95" y="-3.5" width="190" height="7" rx="3.5" fill="url(#sl)" transform="rotate(28)"/></g></g>
</svg>
