<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <style>
      .title{font-size:17px;font-weight:600;fill:#1f2933;text-anchor:middle}
      .sub{font-size:11.5px;fill:#64748b;text-anchor:middle;font-style:italic}
      .slice{stroke:#ffffff;stroke-width:2}
      .pct{font-size:15px;font-weight:600;fill:#ffffff;text-anchor:middle}
      .leg{font-size:12.5px;fill:#334155}
      .legpct{font-size:12.5px;font-weight:600;fill:#1f2933}
    </style>
  </defs>

  <rect x="0" y="0" width="720" height="430" fill="#ffffff"/>

  <text class="title" x="360" y="34">Legendary Arena — revenue mix</text>
  <text class="sub" x="360" y="54">Illustrative proportions — not a forecast or target</text>

  <!-- ===== PIE (cx=200 cy=220 r=150) ===== -->
  <g transform="translate(0,10)">
    <path class="slice" fill="#2563eb" d="M200,210 L200.00,60.00 A150,150 0 0,1 246.35,352.66 Z"/>
    <path class="slice" fill="#0891b2" d="M200,210 L246.35,352.66 A150,150 0 0,1 57.34,256.35 Z"/>
    <path class="slice" fill="#7c3aed" d="M200,210 L57.34,256.35 A150,150 0 0,1 97.32,100.66 Z"/>
    <path class="slice" fill="#d97706" d="M200,210 L97.32,100.66 A150,150 0 0,1 200.00,60.00 Z"/>

    <text class="pct" x="288.89" y="200.92">45%</text>
    <text class="pct" x="159.14" y="295.19">25%</text>
    <text class="pct" x="112.85" y="192.51">18%</text>
    <text class="pct" x="166.87" y="131.32">12%</text>
  </g>

  <!-- ===== LEGEND ===== -->
  <g transform="translate(430,130)">
    <rect x="0" y="0"   width="18" height="18" rx="3" fill="#2563eb"/>
    <text class="leg"    x="28" y="14">Legendary Supporter Subscriptions</text>
    <text class="legpct" x="250" y="14" text-anchor="end">45%</text>

    <rect x="0" y="42"  width="18" height="18" rx="3" fill="#0891b2"/>
    <text class="leg"    x="28" y="56">One-Time Cosmetic &amp; Presentation</text>
    <text class="legpct" x="250" y="56" text-anchor="end">25%</text>

    <rect x="0" y="84"  width="18" height="18" rx="3" fill="#7c3aed"/>
    <text class="leg"    x="28" y="98">Enterprise &amp; Organized-Play</text>
    <text class="legpct" x="250" y="98" text-anchor="end">18%</text>

    <rect x="0" y="126" width="18" height="18" rx="3" fill="#d97706"/>
    <text class="leg"    x="28" y="140">Premium Recognition Tiers</text>
    <text class="legpct" x="250" y="140" text-anchor="end">12%</text>
  </g>
</svg>
