<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="First-party abstract comic-toned background">
  <!-- WP-666 first-party abstract art (project-owned, not a Marvel/UD scan).
       Subtle pop-art TONE: a smooth warm gradient (scales without zoom
       artifacts) with a very fine, low-opacity halftone and faint corner rays.
       Designed to sit quietly behind the board, not compete with the cards. -->
  <defs>
    <linearGradient id="comicGround" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6c860"/>
      <stop offset="50%" stop-color="#e8a63e"/>
      <stop offset="100%" stop-color="#c67f22"/>
    </linearGradient>
    <pattern id="comicDots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.2" fill="#7c3d0a" fill-opacity="0.10"/>
    </pattern>
    <radialGradient id="comicGlow" cx="28%" cy="24%" r="75%">
      <stop offset="0%" stop-color="#fde7b0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fde7b0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1200" fill="url(#comicGround)"/>
  <rect width="1600" height="1200" fill="url(#comicGlow)"/>
  <rect width="1600" height="1200" fill="url(#comicDots)"/>
  <g stroke="#9a5a12" stroke-opacity="0.06" stroke-width="60">
    <path d="M-100 -100 L1750 500"/>
    <path d="M-100 100 L1750 900"/>
    <path d="M-100 1350 L1750 700"/>
  </g>
</svg>
