<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="First-party abstract midtown night skyline background">
  <!-- WP-666 first-party abstract art (project-owned, not a Marvel/UD scan).
       Abstract night-city skyline: gradient sky, layered building silhouettes,
       scattered lit windows. Generic city, no trademarked landmark. -->
  <defs>
    <linearGradient id="midSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1a3a"/>
      <stop offset="55%" stop-color="#13244d"/>
      <stop offset="100%" stop-color="#26426f"/>
    </linearGradient>
    <radialGradient id="midGlow" cx="50%" cy="88%" r="60%">
      <stop offset="0%" stop-color="#3b6ea5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3b6ea5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#midSky)"/>
  <rect width="1600" height="900" fill="url(#midGlow)"/>
  <circle cx="1280" cy="180" r="70" fill="#dbe6f5" fill-opacity="0.85"/>
  <circle cx="1280" cy="180" r="120" fill="#dbe6f5" fill-opacity="0.10"/>
  <!-- far skyline -->
  <g fill="#16294f">
    <rect x="0" y="560" width="120" height="340"/>
    <rect x="130" y="500" width="90" height="400"/>
    <rect x="240" y="590" width="140" height="310"/>
    <rect x="400" y="520" width="80" height="380"/>
    <rect x="1120" y="540" width="150" height="360"/>
    <rect x="1290" y="500" width="90" height="400"/>
    <rect x="1400" y="580" width="200" height="320"/>
  </g>
  <!-- near skyline -->
  <g fill="#0d1c3a">
    <rect x="470" y="470" width="120" height="430"/>
    <rect x="600" y="380" width="150" height="520"/>
    <rect x="760" y="440" width="110" height="460"/>
    <rect x="880" y="330" width="130" height="570"/>
    <rect x="1020" y="450" width="120" height="450"/>
  </g>
  <!-- lit windows -->
  <g fill="#ffd98a" fill-opacity="0.85">
    <rect x="632" y="420" width="12" height="16"/>
    <rect x="662" y="420" width="12" height="16"/>
    <rect x="692" y="420" width="12" height="16"/>
    <rect x="632" y="470" width="12" height="16"/>
    <rect x="692" y="470" width="12" height="16"/>
    <rect x="662" y="520" width="12" height="16"/>
    <rect x="912" y="380" width="12" height="16"/>
    <rect x="942" y="380" width="12" height="16"/>
    <rect x="972" y="380" width="12" height="16"/>
    <rect x="912" y="430" width="12" height="16"/>
    <rect x="972" y="430" width="12" height="16"/>
    <rect x="942" y="480" width="12" height="16"/>
    <rect x="912" y="530" width="12" height="16"/>
    <rect x="1052" y="500" width="12" height="16"/>
    <rect x="1092" y="500" width="12" height="16"/>
    <rect x="1052" y="550" width="12" height="16"/>
    <rect x="506" y="520" width="12" height="16"/>
    <rect x="546" y="520" width="12" height="16"/>
    <rect x="506" y="570" width="12" height="16"/>
  </g>
</svg>
