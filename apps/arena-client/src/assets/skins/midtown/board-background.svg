<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="First-party abstract midtown night background">
  <!-- WP-666 first-party abstract art (project-owned, not a Marvel/UD scan).
       Subtle night-city TONE: a smooth deep-blue vertical gradient (scales
       without zoom artifacts) with a faint low skyline band and a soft glow.
       Understated so the board reads clearly on top. -->
  <defs>
    <linearGradient id="midSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1730"/>
      <stop offset="60%" stop-color="#12244a"/>
      <stop offset="100%" stop-color="#1c3a63"/>
    </linearGradient>
    <radialGradient id="midGlow" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#3f6fa8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3f6fa8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1200" fill="url(#midSky)"/>
  <rect width="1600" height="1200" fill="url(#midGlow)"/>
  <!-- faint low skyline band, anchored near the bottom -->
  <g fill="#0a1526" fill-opacity="0.55">
    <rect x="0" y="1030" width="150" height="170"/>
    <rect x="140" y="980" width="90" height="220"/>
    <rect x="250" y="1050" width="130" height="150"/>
    <rect x="400" y="1000" width="80" height="200"/>
    <rect x="500" y="940" width="120" height="260"/>
    <rect x="640" y="1010" width="110" height="190"/>
    <rect x="770" y="970" width="100" height="230"/>
    <rect x="890" y="1020" width="130" height="180"/>
    <rect x="1040" y="960" width="110" height="240"/>
    <rect x="1170" y="1030" width="150" height="170"/>
    <rect x="1340" y="990" width="90" height="210"/>
    <rect x="1450" y="1040" width="150" height="160"/>
  </g>
  <g fill="#ffd98a" fill-opacity="0.18">
    <circle cx="1300" cy="200" r="46"/>
  </g>
</svg>
