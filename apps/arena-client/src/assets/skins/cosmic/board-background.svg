<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="First-party abstract cosmic background">
  <!-- WP-666 first-party abstract art (project-owned, not a Marvel/UD scan).
       Subtle deep-space TONE: a smooth radial gradient (scales without zoom
       artifacts) with soft nebula washes and fine, small stars. Understated. -->
  <defs>
    <radialGradient id="cosGround" cx="55%" cy="42%" r="90%">
      <stop offset="0%" stop-color="#1c1440"/>
      <stop offset="55%" stop-color="#120c2b"/>
      <stop offset="100%" stop-color="#070512"/>
    </radialGradient>
    <radialGradient id="cosNebA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cosNebB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cosStars" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="26" r="1.3" fill="#ffffff" fill-opacity="0.55"/>
      <circle cx="74" cy="52" r="1.0" fill="#ffffff" fill-opacity="0.40"/>
      <circle cx="44" cy="96" r="1.6" fill="#ffffff" fill-opacity="0.60"/>
      <circle cx="100" cy="12" r="0.9" fill="#ffffff" fill-opacity="0.35"/>
      <circle cx="8" cy="70" r="1.1" fill="#ffffff" fill-opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="1600" height="1200" fill="url(#cosGround)"/>
  <ellipse cx="1080" cy="360" rx="720" ry="520" fill="url(#cosNebA)"/>
  <ellipse cx="420" cy="820" rx="620" ry="440" fill="url(#cosNebB)"/>
  <rect width="1600" height="1200" fill="url(#cosStars)"/>
</svg>
