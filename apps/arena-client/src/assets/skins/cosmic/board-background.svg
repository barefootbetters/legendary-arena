<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="First-party abstract cosmic nebula starfield background">
  <!-- WP-666 first-party abstract art (project-owned, not a Marvel/UD scan).
       Deep-space arena: dark ground, a nebula wash, and scattered stars. -->
  <defs>
    <radialGradient id="cosGround" cx="60%" cy="40%" r="95%">
      <stop offset="0%" stop-color="#211747"/>
      <stop offset="55%" stop-color="#120b2c"/>
