<!DOCTYPE html>
<!-- why: legends-board is a dark cinematic attract board (WP-143) shown on
     big screens and Twitch. The brand tokens ship BOTH a light default and a
     dark set, but the dark values only apply under html[data-theme="dark"] —
     without this attribute the board would inherit the light default
     (--la-color-bg-primary #fdfcf8) and render warm off-white, which is a
     product regression for an unattended kiosk surface. play.* and cards.*
     deliberately take the light default; legends pins dark. There is no theme
     toggle here: the attribute is static, not user-switchable. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hall of Legends — Legendary Arena</title>
    <!-- Brand-token consumption (EC-417; pattern from WP-007a / WP-007b).
         Cascade contract: both stylesheets set the same CSS custom
         properties on :root at equal specificity. Per CSS spec, equal-
         specificity declarations resolve by source order — the later
         declaration wins. The cross-origin <link> is listed AFTER the
         local fallback BY DESIGN:
           (1) cross-origin fetch succeeds → live v1 declarations apply
               (live contract is authoritative);
           (2) cross-origin fetch fails (network failure, CORS
               regression, www outage) → fallback's v1 declarations
               apply (bundled snapshot is the safety net).
         Both files MUST share byte-identical contents (after stripping
         the 4-line SNAPSHOT comment header from the local file); SHA-256
         parity is verified at lock and at every WP that touches either
         side of the contract.
         The crossorigin attribute is intentionally OMITTED for the
         same reason as WP-007a / WP-007b: the live URL responds with
         Access-Control-Allow-Origin: *, so the link works without an
         explicit CORS mode declaration. -->
    <link rel="stylesheet" href="/brand-tokens.local.css" />
    <link rel="stylesheet" href="https://www.legendary-arena.com/brand-tokens.css" />
    <style>
      /* Colors and fonts route through brand tokens loaded above.
         why: the var() fallbacks below carry literal values even though
         EC-154 bans raw hex outside the snapshot. Unlike play.* and cards.*,
         this surface runs unattended on a kiosk/Twitch screen where a
         both-stylesheets-failed state would paint default-white and blow out
         a dark room. The fallbacks mirror the dark token set and are dead
         code whenever either stylesheet loads. */
      body {
        margin: 0;
        background: var(--la-color-bg-primary, #0b0f19);
        color: var(--la-color-text-primary, #f5f7fb);
        font-family: var(--la-font-body, system-ui, -apple-system, sans-serif);
      }
      .static-fallback {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 2rem;
      }
      .static-fallback h1 {
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
        /* why: 135deg preserved from the pre-token board — the diagonal gold
           sweep is the Hall of Legends' identity. Only the color stops move
           onto tokens, so a v1 → v2 palette bump carries through. */
        background: linear-gradient(
          135deg,
          var(--la-color-gold-bright, #f0c94a),
          var(--la-color-gold-muted, #9e7c1c)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .static-fallback p {
        font-size: 1.1rem;
        color: var(--la-color-text-secondary, #a7b0c5);
        max-width: 400px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="static-fallback">
        <h1>Hall of Legends</h1>
        <p>Live scoreboard requires JavaScript. Enable JavaScript to view the latest rankings and achievements.</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
