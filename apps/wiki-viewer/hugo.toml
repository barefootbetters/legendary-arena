# why: D-13808 selects Hugo Extended (Docusaurus rejected for MDX risk; custom
# rejected for build cost vs zero feature lift). The five constraints in
# WP-139 §Decisions / D-13808 are encoded as: pure markdown content (no MDX
# extension enabled), build-time only (no runtime backend), in-tree source
# (wiki/ projection only), explicit external-link strategy via render
# hook (D-13809), reserved-file handling via projection (D-13810).
# why: determinism knobs — enableGitInfo=false stops Hugo from embedding
# commit-derived `lastmod` fields into HTML (any HEAD move would break the
# byte-identical output lock); disableKinds removes RSS / sitemap / taxonomy
# outputs that can embed timestamps. Two consecutive `pnpm wiki-viewer:build`
# invocations must produce identical *.html + *.css per WP-139 Verification
# Step 2.

baseURL = "https://legendary-arena-wiki.example.invalid/"
title = "Legendary Arena Engineering Wiki"
# why: `locale` replaces `languageCode`, which Hugo deprecated in v0.158.0
# (warned in the build log under the 0.161.1 pin). Same BCP-47 value; renamed
# to silence the deprecation before it becomes a hard error on a future bump.
locale = "en-us"

enableGitInfo = false
disableKinds = ["RSS", "sitemap", "taxonomy", "term"]
disableHugoGeneratorInject = true

# why: D-24782 — the page shell, the core partials, the render hooks and the
# shared shortcodes come from the shared ewiki theme, bb-studio-ewiki-theme
# v1.3.0, vendored read-only at themes/ewiki/ and pinned by digest in
# .github/workflows/wiki-viewer.yml (D-24728). The engine's own behavior
# (type-grouped sidebar, six-field metadata panel, Related / Sources, its
# footer paragraphs) lives in layouts/partials/ewiki/ and assets/css/. This key
# sits above [markup]: after a table header it would become outputs.theme.
theme = "ewiki"

[markup]
  # why: disable syntax highlighting on fenced code blocks — Chroma's inline
  # CSS output is non-deterministic across consecutive builds (the
  # `-webkit-text-size-adjust:none` rule and per-cell `style=text-align:left`
  # for tables flip between identical builds). Plain `<pre><code>` blocks
  # render the markdown ```ts``` content deterministically with zero loss of
  # readability for an engineering reference. Re-enabling highlighting in a
  # future WP requires a class-based theme + a stable Chroma config.
  [markup.highlight]
    codeFences = false
    noClasses = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML"]

# why: the theme reads its site settings from [params.ewiki] (D-24782). repo,
# branch, contentRoot and localRoot build the "Editing this page" links and the
# local path to cd into (wiki/<page>.md under C:\dev\legendary-arena, a
# single-quoted literal so the backslashes stay literal). homeSource names
# INDEX.md, which the projection copies to _index.md as the home page, so the
# theme's link hook sends a link to INDEX.md to "/" as the engine's hook did.
# private = true keeps noindex on every page: the site sits
# behind Cloudflare Access. search = true keeps the one Pagefind loader
# (D-24293), with the engine's own placeholder and label. searchFilters stays
# off: it would add a Kind filter, empty here because the engine has no
# sections, and repeat Status and Tag, which the engine's own spans in
# layouts/partials/ewiki/metadata.html already give search.
[params.ewiki]
  repo = "barefootbetters/legendary-arena"
  branch = "main"
  contentRoot = "wiki"
  localRoot = 'C:\dev\legendary-arena'
  homeSource = "INDEX.md"
  private = true
  search = true
  searchPlaceholder = "Search the wiki"
  searchLabel = "Search the engineering wiki"
