name: CI → Build → Deploy

on:
  # why: two separate `push:` keys in one mapping silently collide —
  # YAML keeps only the last, so non-tag pushes to main were skipping
  # CI entirely. Merged into a single `push:` with both branches and
  # tags. Publishing to npm + uploading to R2 remains gated by the
  # `if: startsWith(github.ref, 'refs/tags/v')` on those jobs.
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Validate card data ───────────────────────────────────────────────────
  validate:
    name: Validate Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run registry validation
        run: pnpm registry:validate

      - uses: actions/upload-artifact@v4
        with:
          name: registry-health
          path: packages/registry/dist/registry-health.json

  # ── 2. Build dist/ ─────────────────────────────────────────────────────────
  build:
    name: Build Registry Dist
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Build TypeScript types
        run: pnpm registry:build

      - uses: actions/upload-artifact@v4
        with:
          name: registry-dist
          path: packages/registry/dist/

  # ── 3. Build viewer ────────────────────────────────────────────────────────
  build-viewer:
    name: Build Registry Viewer
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Download registry dist
        uses: actions/download-artifact@v4
        with: { name: registry-dist, path: packages/registry/dist }

      # why: registry-viewer imports @legendary-arena/lagn (WP-245 loadout
      # export), whose package "types" resolve to dist/*.d.ts. lagn's dist is
      # gitignored and this job only downloads the registry dist artifact, so
      # without an explicit build vue-tsc fails with TS2307 "Cannot find module
      # '@legendary-arena/lagn'". lagn depends only on zod (no registry dist
      # needed), so a filtered build is enough — no need for a full `pnpm -r build`.
      - name: Build lagn types
        run: pnpm --filter @legendary-arena/lagn build

      - name: Lint viewer
        run: pnpm --filter registry-viewer lint

      - name: Typecheck viewer
        run: pnpm --filter registry-viewer typecheck

      - name: Build viewer
        run: pnpm viewer:build

      - uses: actions/upload-artifact@v4
        with:
          name: viewer-dist
          path: apps/registry-viewer/dist/

  # ── 3b. Typecheck arena-client ───────────────────────────────────────────────
  # why: WP-166 — gate `vue-tsc --noEmit` on arena-client so the ~40 errors this
  # packet cleared cannot silently re-drift. Nothing else on the green path
  # type-checks the client (Vite uses esbuild; tests run under tsx; only
  # registry-viewer typecheck was gated before). Runs as its own job because
  # arena-client imports @legendary-arena/game-engine and @legendary-arena/preplan
  # whose package "types" resolve to dist/*.d.ts — those declarations must be
  # built first, and build-viewer only provides the registry dist.
  typecheck-arena-client:
    name: Typecheck Arena Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # why: builds all workspace packages in dependency order so game-engine
      # and preplan emit the dist/*.d.ts that vue-tsc resolves against.
      - name: Build workspace
        run: pnpm -r build

      - name: Typecheck arena-client
        run: pnpm --filter @legendary-arena/arena-client typecheck

  # ── 3d. Coverage & Ledger gates ──────────────────────────────────────────────
  # why: this job aggregates the repo's markdown/artifact integrity gates that
  # share one workspace build — the hero-effect coverage baseline (below), the
  # node-toolchain pin, the hero/villain mechanic-ledger + metadata + effect-index
  # + runtime-observed freshness checks, the WP/EC/D number-allocation ledger, and
  # the WORK_INDEX row-pattern check. The display name is "Coverage & Ledger Gates"
  # (not "Hero Effect Coverage") so a failure in any of them — e.g. a duplicate
  # number-ledger reservation — surfaces under an honest name instead of reading
  # as a coverage regression (the same self-describing-gate principle the
  # WORK_INDEX row-pattern step below was split out for).
  #
  # The coverage gate itself (WP-250 / D-24021) gates hero-effect coverage against
  # a committed baseline so the Lever 1/2 effect-system refactor
  # (docs/ai/DESIGN-EFFECT-AUTHORING-SCALE.md) cannot silently reduce how many
  # printed hero abilities actually execute. Hybrid posture: a noEffect rise or a
  # vanished set hard-fails; a brand-new unmodeled [keyword:X] warns only. Builds
  # the workspace first so the probe can import game-engine + registry dist/.
  hero-effect-coverage:
    name: Coverage & Ledger Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -r build

      - name: Hero-effect coverage gate
        run: pnpm sim:coverage --check

      # why (WP-400 / D-24205): the Node version is restated across 21 workflow
      # entries and two render.yaml envVars. A partial bump is invisible until a
      # version-sensitive failure reproduces in one environment and not another
      # — two Pages builds three days apart reported 22.22.0 and 22.16.0 from
      # this repo. This gate asserts .node-version is exact, that render.yaml
      # (whose NODE_VERSION OUTRANKS the file) agrees, that no workflow restates
      # a literal, and that engines stays a floor.
      - name: Node toolchain pin
        run: pnpm check:node-pin

      # why: the committed hero mechanic ledger (docs/ai/coverage/) is generated
      # from the same registry + engine dist; this freshness gate fails if a
      # card-data or keyword change landed without regenerating it, so the
      # at-a-glance worklist / debugging index never silently goes stale.
      - name: Hero mechanic ledger freshness
        run: pnpm ledger:heroes:check

      # why (WP-271 / D-24048): the committed villain/henchman mechanic ledger
      # (docs/ai/coverage/villain-mechanic-ledger.{json,csv}) is generated from the
      # same registry + engine dist via the villain ability parser's by-hook
      # resolution; this freshness gate fails if a card-data or villain-vocabulary
      # change landed without regenerating it, so the villain/henchman worklist +
      # debugging index never silently goes stale (the sibling of the hero gate above).
      - name: Villain mechanic ledger freshness
        run: pnpm ledger:villains:check

      # why (WP-269 / D-24046): the published hero-mechanic feed
      # (data/metadata/card-mechanics.json) is regenerated from the same committed
      # ledger + engine dist by a deterministic transform; this freshness gate fails
      # if the committed feed drifts, so the registry-viewer (WP-270) never fetches a
      # taxonomy that diverged from the ledger. Runs after `pnpm -r build` because the
      # transform imports the registry dist (self-validation) and the engine dist
      # (source classification).
      - name: Card mechanic metadata freshness
        run: pnpm mechanics:metadata:check

      # why (WP-484 / D-24289): the published effect-implementation index
      # (data/metadata/effect-implementation-index.json) is regenerated by a
      # deterministic verbatim join of the two committed mechanic ledgers (hero +
      # villain); this freshness gate fails if the committed index drifts, so the
      # future /debug/effects viewer never reads an index that diverged from the
      # ledgers. Runs after `pnpm -r build` because the transform imports the
      # registry dist for self-validation (it reads no engine dist — the ledgers
      # already carry status + handler + wp + decision).
      - name: Effect implementation index freshness
        run: pnpm effect-index:check

      # why (WP-259 / D-24035): the committed runtime-observed-hollows artifact is
      # regenerated from the same engine dist via a fixed-seed deterministic sweep;
      # this freshness gate fails if it drifts. The committed per-PR artifact is a
      # fast random-policy SMOKE BASELINE (a recorded zero-state — see the artifact's
      # matrixDescription); the heavier competent-play sweep that surfaces real
      # runtime hollows is a deferred cron follow-up (the CI-affordability fallback),
      # not run here.
      - name: Runtime-observed hollows freshness
        run: pnpm sim:runtime-observed:check

      # why (D-24242): the WP/EC/D number-allocation lock. Fails loudly if two
      # sessions reserved the same number in docs/ai/NUMBER-LEDGER.md (a
      # DUPLICATE), or if a frontier number was used in WORK_INDEX / EC_INDEX /
      # DECISIONS above the high-water without a matching ledger reservation
      # (drift). Turns a silent late-at-merge collision (WP-419 → WP-421) into an
      # early, loud CI failure. Reads markdown only — no build dependency.
      - name: Number allocation ledger
        run: pnpm ledger:numbers:check

      # why (WP-455 / D-24275): the WORK_INDEX WP-row format drift guard, as a
      # dedicated, self-describing gate. The same canonical WORK_INDEX_ROW_PATTERN
      # is already enforced by the dashboard's workIndexRowPattern.test.ts inside
      # the Dashboard Gates job, but there a drifted row surfaces confusingly as a
      # coverage failure (twice mis-diagnosed during the WP-453/454 arc). This step
      # names the failure for what it is. It reuses the single-source pattern by
      # extraction (no second regex copy). Reads markdown only — no build dependency.
      - name: WORK_INDEX row-pattern check
        run: pnpm workindex:rows:check

  # ── 3c. Dashboard gates ──────────────────────────────────────────────────────
  # why: wires the apps/dashboard checks from
  # apps/dashboard/docs/code-checks-and-balances.md §11 into CI. The dashboard is
  # self-contained (no @legendary-arena/* runtime imports), so this job needs no
  # prior build artifacts and runs independently of the registry chain.
  # lint / typecheck / coverage / format / build all run as blocking gates.
  dashboard:
    name: Dashboard Gates
    runs-on: ubuntu-latest
    steps:
      # why: fetch-depth 0 gives the governance-snapshot generator full git
      # history (it reads `git log`); a shallow clone would thin the snapshot.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # why: src/data/governance-snapshot.json is generated at build time and
      # gitignored, but useGovernanceSnapshot.ts imports it statically — so it
      # must exist before typecheck / test / build can resolve the module.
      - name: Generate governance snapshot
        run: pnpm --filter @legendary-arena/dashboard prebuild:snapshot

      # why: src/data/coverage-ledger.json is a build-time copy of the committed
      # hero mechanic ledger (gitignored) imported statically by useCoverageLedger
      # — it must exist before typecheck / test / build can resolve the module.
      - name: Generate coverage ledger
        run: pnpm --filter @legendary-arena/dashboard prebuild:coverage

      # why (WP-487): src/data/effect-implementation-index.json is a build-time
      # copy of the committed Effect Implementation Index (gitignored) imported
      # statically by useEffectIndex — it must exist before typecheck / test /
      # build can resolve the module (the same reason as the coverage ledger above).
      - name: Generate effect index
        run: pnpm --filter @legendary-arena/dashboard prebuild:effect-index

      # why (WP-487): the dashboard now imports @legendary-arena/registry/schema
      # (the /schema subpath resolves to the registry dist) — its first workspace
      # dependency. Build the registry dist so typecheck / test / build can resolve
      # the module; nothing built it in this job before (the dashboard had only
      # external npm deps).
      - name: Build registry dist
        run: pnpm registry:build

      - name: Lint dashboard
        run: pnpm --filter @legendary-arena/dashboard lint

      - name: Typecheck dashboard
        run: pnpm --filter @legendary-arena/dashboard typecheck

      - name: Test dashboard (coverage thresholds)
        run: pnpm --filter @legendary-arena/dashboard test:coverage

      - name: Format check dashboard
        run: pnpm --filter @legendary-arena/dashboard format:check

      - name: Build dashboard
        run: pnpm --filter @legendary-arena/dashboard build

  # ── 3e. LAGN schema drift guard ──────────────────────────────────────────────
  # why: packages/lagn-spec/schemas/lagn-v1.json is generated from the Zod source
  # (src/validator.ts → generateSchema()) and committed to the repo, but nothing on
  # the green path regenerated it. A Zod-source change without re-running the
  # generator would land a stale schema silently — only a human noticing `git
  # status` would catch it. This gate regenerates from current source and fails if
  # the committed copy drifts. lagn depends only on zod (no registry/workspace dist
  # needed), so a filtered regenerate is enough and this job runs independently of
  # the registry chain.
  lagn-schema-drift:
    name: LAGN Schema Drift Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # why: generate:schema runs `tsc` before the generator so it imports freshly
      # compiled dist/validator.js, never a stale incremental build (the footgun
      # that produced spurious local drift before this guard existed).
      - name: Regenerate schema from Zod source
        run: pnpm --filter @legendary-arena/lagn generate:schema

      - name: Assert committed schema matches generator output
        run: |
          if ! git diff --quiet -- packages/lagn-spec/schemas/lagn-v1.json; then
            echo "::error file=packages/lagn-spec/schemas/lagn-v1.json::Committed LAGN schema is out of sync with its generator. Run 'pnpm --filter @legendary-arena/lagn generate:schema' and commit the result."
            git --no-pager diff -- packages/lagn-spec/schemas/lagn-v1.json
            exit 1
          fi
          echo "LAGN schema is in sync with generator output."

  # ── 3f. Workspace unit tests ─────────────────────────────────────────────────
  # why: no other job runs the package/app unit-test suites, so a red suite can
  # merge silently — PR #619 landed a 24th HERO_KEYWORDS entry without updating
  # the drift-detection count assertion in heroKeywords.test.ts and went to main
  # red; the mismatch was only reconciled by later keyword PRs. This job makes
  # `pnpm -r test` a blocking PR gate. Builds the workspace first because apps
  # and cross-package suites import their dependencies' built dist (registry,
  # game-engine, lagn, vue-sfc-loader); tests themselves run via tsx on src.
  # DB-gated server tests self-skip when TEST_DATABASE_URL is unset, so the
  # default runner environment is sufficient.
  # ── 3h. SPA asset-masking gate ───────────────────────────────────────────────
  # why: apps/arena-client and apps/legends-board both ship the Cloudflare Pages
  # catch-all `/*  /index.html  200` in public/_redirects. That rule is required
  # for client-side routing, but when a hashed bundle referenced by index.html is
  # absent the request does NOT 404 — it falls through and returns index.html with
  # HTTP 200 and Content-Type: text/html. The browser gets HTML where it expects a
  # module, the app never mounts, and the page sits on its no-JS fallback: a silent
  # white page with no failed request to notice. Observed live on
  # legends.legendary-arena.com 2026-07-18. A reachability probe reports a healthy
  # 200 for that state (the HTML itself serves fine), so this needs its own gate.
  #
  # This job is the hermetic half: it verifies every asset referenced by each
  # built index.html actually exists in the build output. The deploy/edge-drift
  # half — the failure class actually observed — cannot be seen from PR CI and
  # runs nightly against the live origins in spa-assets-nightly.yml.
  spa-assets:
    name: SPA Asset Masking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # why: `pnpm -r build` emits the arena-client and legends-board dist/
      # trees this gate inspects, and builds their workspace dependencies in
      # order (arena-client resolves game-engine and preplan dist at build time).
      - name: Build workspace
        run: pnpm -r build

      - name: Check built SPA assets resolve
        run: pnpm check:spa-assets

  unit-tests:
    name: Workspace Unit Tests
    runs-on: ubuntu-latest
    # why: the whole-repo suite runs in ~7 min; without a cap this job inherits
    # GitHub's 6-hour default, so a single leaked timer/handle in any test file
    # (e.g. a component mounted but never unmounted whose poll keeps the node:test
    # event loop open) hangs the job for hours before failing instead of failing
    # fast. 20 min is ~3x the normal runtime — comfortable headroom for a slow
    # runner, while turning a hang into a quick red X.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -r build

      # why: the dashboard suite is excluded here because the Dashboard Gates
      # job already runs it with stricter coverage thresholds (test:coverage)
      # on a fetch-depth-0 checkout its governance-snapshot generator prefers;
      # re-running it here would only duplicate runtime on a shallow clone.
      - name: Run workspace test suites
        run: pnpm -r --filter '!@legendary-arena/dashboard' test

      # why: the workspace root is excluded from `pnpm -r` and has no plain
      # `test` script, so the roadmap-counts generator suite is otherwise
      # uncovered — the roadmap-counts cron workflow runs only the generator,
      # never its tests.
      - name: Run root roadmap-counts suite
        run: pnpm roadmap:counts:test

      # why: same reason as roadmap-counts — the effect-index generator's
      # mastermind-tactic-feed suite (WP-507) lives at the workspace root, which
      # `pnpm -r` skips; without this step the tactic feed's verbatim-honesty
      # invariants (unmapped tactic → unmarked + blanks) would be un-gated.
      - name: Run root effect-index generator suite
        run: pnpm effect-index:test

  # ── 4. Upload to R2 (tags only) ────────────────────────────────────────────
  upload-r2:
    name: Upload to Cloudflare R2
    needs: [build, build-viewer]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Download registry dist
        uses: actions/download-artifact@v4
        with: { name: registry-dist, path: packages/registry/dist }

      - name: Upload data + images to R2
        run: pnpm registry:upload
        env:
          DATA_VERSION:           ${{ github.ref_name }}
          R2_ACCOUNT_ID:          ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:       ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY:   ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:         ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL:          ${{ secrets.R2_PUBLIC_URL }}

  # ── 5. Publish to npm (tags only) ──────────────────────────────────────────
  publish-npm:
    name: Publish to npm
    needs: upload-r2
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Download registry dist
        uses: actions/download-artifact@v4
        with: { name: registry-dist, path: packages/registry/dist }

      - name: Publish @legendary-arena/registry
        run: pnpm publish --filter @legendary-arena/registry --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
