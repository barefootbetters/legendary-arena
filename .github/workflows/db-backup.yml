name: DB Backup

# why (WP-416 / D-24236): provider-independent PostgreSQL backup. Runs pg_dump
# against the Render-managed database and uploads the dump to a PRIVATE Cloudflare
# R2 bucket, so a loss of the Render account/region (DISASTER_RECOVERY.md DR-05) is
# recoverable from a copy that does not depend on Render. Runs in CI, independent of
# the app server, because pg_dump is not in the Render Node image but is trivial on
# a runner, and CI keeps backing up even when the server is down.

on:
  schedule:
    # why: 09:17 UTC — off the top of the hour to avoid the runner contention that
    # peaks at :00. Daily cadence gives the v1 ~24h Recovery Point Objective.
    - cron: '17 9 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Guard on secret presence
        id: guard
        # why: GitHub Actions forbids the `secrets` context in a job-level `if:`, so
        # map secret-presence to a step output. When BACKUP_DATABASE_URL is absent
        # the later steps skip and the job concludes green — a skip, not a pass, and
        # never a reported backup success.
        run: |
          echo "has_secrets=${{ secrets.BACKUP_DATABASE_URL != '' }}" >> "$GITHUB_OUTPUT"
          # why: the pCloud second-offsite-copy (3-2-1, DISASTER_RECOVERY.md §3) is
          # optional and independently gated. When RCLONE_PCLOUD_TOKEN is absent the
          # mirror step skips green and only the R2 copy is produced — no failure, the
          # same skip-not-pass posture as the primary guard above.
          echo "has_pcloud=${{ secrets.RCLONE_PCLOUD_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.guard.outputs.has_secrets == 'true'
        uses: actions/checkout@v5

      - name: Set up Node
        if: steps.guard.outputs.has_secrets == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          # why: setup-node@v5 defaults package-manager-cache to true, which reads
          # the repo's `packageManager: pnpm` field and tries to prime a pnpm cache
          # before pnpm is installed on the runner — failing the step. This job needs
          # only plain `node` for scripts/db-backup-retention.mjs (node: built-ins,
          # no install), so disable the package-manager cache entirely.
          package-manager-cache: false

      - name: Install and verify PostgreSQL 18 client
        if: steps.guard.outputs.has_secrets == 'true'
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          # why: the runner ships a distro postgresql-client (v16) whose
          # /usr/bin/pg_dump shadows the freshly-installed pgdg v18 binary on PATH.
          # Prepend the versioned bin dir so every later step's `pg_dump` is v18, and
          # enforce the >=18 floor against that explicit path (not the shadowed one) —
          # a missing v18 binary fails the run under `set -e`, not a silent mismatch.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          major="$(/usr/lib/postgresql/18/bin/pg_dump --version | grep -oE '[0-9]+' | head -1)"
          if [ "$major" -lt 18 ]; then
            echo "pg_dump major version $major is below the required 18; refusing to run." >&2
            exit 1
          fi

      - name: Dump the database
        if: steps.guard.outputs.has_secrets == 'true'
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          # why: never `set -x` and never echo the URL here — it carries the DB
          # password; it is passed via env (not argv, which the process list exposes)
          # and relies on Actions secret masking.
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "BACKUP_STAMP=$stamp" >> "$GITHUB_ENV"
          echo "BACKUP_KEYDATE=$(date -u +%Y/%m/%d)" >> "$GITHUB_ENV"
          pg_dump -Fc "$BACKUP_DATABASE_URL" -f "/tmp/legendary-arena-$stamp.dump"
          size="$(stat -c%s "/tmp/legendary-arena-$stamp.dump")"
          # why: a wrong or empty BACKUP_DATABASE_URL can exit 0 with a near-empty
          # dump; require a real dump (> 1024 bytes) before it counts as success.
          if [ "$size" -le 1024 ]; then
            echo "Dump is only $size bytes; treating it as a failed backup." >&2
            exit 1
          fi

      - name: Upload to R2 and prune old backups
        if: steps.guard.outputs.has_secrets == 'true'
        env:
          # why: the aws CLI reads AWS_* names, not R2_*; map them, target the R2
          # S3 endpoint, and disable the aws-cli v2 default integrity checksums that
          # break Cloudflare R2 PutObject.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          # why: operator-provisioned secrets occasionally carry a trailing newline or
          # stray whitespace from a paste. Whitespace is never valid in an account id,
          # access key, or bucket name — and a newline in the account id breaks the R2
          # endpoint hostname (a TLS handshake failure, not an auth error). Strip it.
          AWS_ACCESS_KEY_ID="$(printf '%s' "$AWS_ACCESS_KEY_ID" | tr -d '[:space:]')"
          AWS_SECRET_ACCESS_KEY="$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | tr -d '[:space:]')"
          R2_ACCOUNT_ID="$(printf '%s' "$R2_ACCOUNT_ID" | tr -d '[:space:]')"
          R2_BACKUP_BUCKET="$(printf '%s' "$R2_BACKUP_BUCKET" | tr -d '[:space:]')"
          # why: R2_ACCOUNT_ID must be the BARE 32-hex Cloudflare account id — the R2
          # endpoint is https://<id>.r2.cloudflarestorage.com. A pasted full endpoint or
          # URL yields an invalid multi-label SNI host and a TLS handshake failure (not
          # an auth error). Recover the id from a wrapped value, then require 32-hex so a
          # wrong value fails clearly here instead of cryptically at the TLS layer.
          R2_ACCOUNT_ID="${R2_ACCOUNT_ID#https://}"
          R2_ACCOUNT_ID="${R2_ACCOUNT_ID%%.r2.cloudflarestorage.com*}"
          if ! printf '%s' "$R2_ACCOUNT_ID" | grep -qiE '^[0-9a-f]{32}$'; then
            echo "R2_ACCOUNT_ID is not a bare 32-hex Cloudflare account id (length ${#R2_ACCOUNT_ID} after sanitizing). Set the secret to just the account id — no https://, no .r2.cloudflarestorage.com, no bucket name." >&2
            exit 1
          fi
          # why: a DB dump must never land in the public images bucket.
          if [ "$R2_BACKUP_BUCKET" = "legendary-images" ]; then
            echo "R2_BACKUP_BUCKET must not be the public images bucket." >&2
            exit 1
          fi
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          key="db-backups/${BACKUP_KEYDATE}/legendary-arena-${BACKUP_STAMP}.dump"
          aws s3 cp "/tmp/legendary-arena-${BACKUP_STAMP}.dump" "s3://${R2_BACKUP_BUCKET}/${key}" --endpoint-url "$endpoint"
          # Prune: list existing backup keys, let the pure selector choose which fall
          # outside the grandfather-father-son retention policy (35 daily / 12 weekly
          # / 12 monthly; scripts/db-backup-retention.mjs), delete only those. Runs
          # only after the
          # upload above succeeded (set -euo pipefail aborts the step on any failure).
          aws s3 ls "s3://${R2_BACKUP_BUCKET}/db-backups/" --recursive --endpoint-url "$endpoint" \
            | awk '{ print $4 }' \
            | node scripts/db-backup-retention.mjs \
            | while read -r staleKey; do
                if [ -n "$staleKey" ]; then
                  aws s3 rm "s3://${R2_BACKUP_BUCKET}/${staleKey}" --endpoint-url "$endpoint"
                fi
              done

      - name: Mirror to pCloud (second offsite copy) and prune
        # why: 3-2-1 — a copy on a vendor independent of Cloudflare, so a single-vendor
        # loss of Cloudflare cannot take both the card images and the only DB backup.
        # Independently gated: skips green until RCLONE_PCLOUD_TOKEN is provisioned.
        if: steps.guard.outputs.has_secrets == 'true' && steps.guard.outputs.has_pcloud == 'true'
        env:
          # why: rclone reads a remote's config from RCLONE_CONFIG_<NAME>_* env vars,
          # so CI needs no rclone.conf file and no interactive login. TOKEN is the JSON
          # blob from `rclone authorize pcloud`; HOSTNAME picks the pCloud data region
          # (api.pcloud.com = US, eapi.pcloud.com = EU) and MUST match the region the
          # token was minted in, or every API call fails.
          RCLONE_CONFIG_PCLOUD_TYPE: pcloud
          RCLONE_CONFIG_PCLOUD_TOKEN: ${{ secrets.RCLONE_PCLOUD_TOKEN }}
          RCLONE_CONFIG_PCLOUD_HOSTNAME: ${{ secrets.RCLONE_PCLOUD_HOSTNAME }}
        run: |
          set -euo pipefail
          # why: ubuntu-latest ships aws-cli but not rclone; install a pinned release
          # (not `apt`, whose rclone lags) so the pCloud backend behaviour is stable.
          rclone_version=v1.73.3
          curl -fsSL "https://downloads.rclone.org/${rclone_version}/rclone-${rclone_version}-linux-amd64.zip" -o /tmp/rclone.zip
          unzip -qo /tmp/rclone.zip -d /tmp
          sudo install "/tmp/rclone-${rclone_version}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version | head -1
          # why: default to US pCloud when the operator did not set a region; an EU
          # account needs RCLONE_PCLOUD_HOSTNAME=eapi.pcloud.com.
          export RCLONE_CONFIG_PCLOUD_HOSTNAME="${RCLONE_CONFIG_PCLOUD_HOSTNAME:-api.pcloud.com}"
          key="db-backups/${BACKUP_KEYDATE}/legendary-arena-${BACKUP_STAMP}.dump"
          # Copy the same dump already sent to R2 — a genuinely independent second
          # vendor. rclone creates the nested folders on pCloud.
          rclone copyto "/tmp/legendary-arena-${BACKUP_STAMP}.dump" "pcloud:${key}" --low-level-retries 3
          # Prune pCloud to the SAME grandfather-father-son policy as R2, via the same
          # pure selector. rclone lsf yields keys relative to db-backups/; re-prefix so
          # they match the selector's `db-backups/...legendary-arena-<stamp>.dump` shape.
          rclone lsf pcloud:db-backups/ --recursive --files-only \
            | sed 's#^#db-backups/#' \
            | node scripts/db-backup-retention.mjs \
            | while read -r staleKey; do
                if [ -n "$staleKey" ]; then
                  rclone delete "pcloud:${staleKey}"
                fi
              done
