# Nightly SPA asset-masking probe against the live public SPAs.
#
# Companion to the hermetic `spa-assets` job in ci.yml. That job proves a BUILD
# references only assets it emitted; this one proves a DEPLOY actually serves
# them. They catch different failures and neither substitutes for the other.
#
# The failure this exists for: apps/arena-client and apps/legends-board ship the
# Cloudflare Pages catch-all `/*  /index.html  200`. When a hashed bundle named
# by the deployed index.html is missing at the edge, the request does not 404 —
# it falls through and returns index.html with HTTP 200 and text/html. The
# browser receives HTML where it expects a module, the app never mounts, and the
# surface sits on its no-JS fallback indefinitely. Observed live on
# legends.legendary-arena.com on 2026-07-18, where the served index.html named a
# bundle hash absent from the deploy.
#
# Why this cannot live in PR CI: it requires the deployed origin, which a PR
# runner cannot see. Why it cannot fold into `pnpm check:domains`: that probe
# fetches the document and reports a healthy 200, because the HTML itself is
# fine — the masking is invisible to a reachability check by construction.
#
# The probe retries internally (3 attempts, 5s apart) so a deploy caught
# mid-rollout — new HTML briefly served against not-yet-propagated assets, which
# self-heals — does not raise a false alarm. Only a stuck bad state fails.
#
# `workflow_dispatch:` permits on-demand operator verification straight after a
# deploy without waiting for the cron tick.

name: SPA Assets Nightly

on:
  schedule:
    # why: 07:20 UTC = 00:20 Pacific Standard Time, matching the existing
    # nightly cadence (sweep runs at 07:00) while staying clear of it so the
    # two do not contend for a runner. The operator sees results during the
    # next-business-morning ops check.
    - cron: '20 7 * * *'
  workflow_dispatch:

jobs:
  probe:
    name: Probe live SPA assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # why package-manager-cache: false — this job deliberately does NOT set up
      # pnpm (see below), but setup-node defaults that input to true, detects the
      # repo's pnpm-lock.yaml, and then fails with "Unable to locate executable
      # file: pnpm" while trying to prime a cache this job never uses. Caught by
      # dispatching the workflow manually on 2026-07-18 rather than discovering a
      # dead nightly at the first cron tick.
      - uses: actions/setup-node@v5
        with: { node-version: 22, package-manager-cache: false }

      # why: no `pnpm install` — the probe is dependency-free (built-in fetch
      # only), so the workflow stays fast and cannot be broken by an unrelated
      # dependency-resolution failure.
      # why dashboard.legendary-arena.com is absent: it sits behind Cloudflare
      # Access, so an unauthenticated probe receives a 302 to the Access login
      # page rather than the app shell. That page carries no same-origin app
      # assets, which trips the zero-reference guard and would leave this
      # nightly permanently red. Verified 2026-07-18. Dashboard is covered by
      # the hermetic build-output half in ci.yml instead. Live coverage would
      # need a CF Access service token (CF-Access-Client-Id / -Client-Secret)
      # added as repository secrets and sent as request headers.
      - name: Probe live SPA assets
        run: node scripts/check-spa-assets.mjs --url https://legends.legendary-arena.com --url https://play.legendary-arena.com --url https://cards.legendary-arena.com
