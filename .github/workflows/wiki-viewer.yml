name: wiki-viewer

# why: trigger on wiki/ or apps/wiki-viewer/ touches per WP-139 §Open
# Decision G default, plus docs/09-CHANGELOG.md (D-24164 — the one docs/ file
# project-wiki.mjs also projects into the ewiki). Render's static_site
# (legendary-arena-wiki) has autoDeploy off; this workflow is the CI-side gate
# (link-integrity + Hugo build) that fires the Render Deploy Hook on pass — so
# any source this build consumes must appear in the paths filter above.

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'ewiki/**'
      - 'apps/wiki-viewer/**'
      - '.github/workflows/wiki-viewer.yml'
      # why: D-24164 — project-wiki.mjs also projects docs/09-CHANGELOG.md into
      # the ewiki, so a changelog-only edit must trigger this gated build+deploy
      # too (Render autoDeploy is off; this workflow's deploy hook is the sole
      # trigger). Without this path, changelog edits would not reach the ewiki.
      - 'docs/09-CHANGELOG.md'
  pull_request:
    paths:
      - 'wiki/**'
      - 'ewiki/**'
      - 'apps/wiki-viewer/**'
      - '.github/workflows/wiki-viewer.yml'
      # why: D-24164 — project-wiki.mjs also projects docs/09-CHANGELOG.md into
      # the ewiki, so a changelog-only edit must trigger this gated build+deploy
      # too (Render autoDeploy is off; this workflow's deploy hook is the sole
      # trigger). Without this path, changelog edits would not reach the ewiki.
      - 'docs/09-CHANGELOG.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read pinned Hugo version
        id: hugo
        run: echo "version=$(cat apps/wiki-viewer/.hugo-version)" >> "$GITHUB_OUTPUT"

      - name: Install Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo.outputs.version }}
          extended: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Project wiki content
        run: pnpm wiki-viewer:project

      - name: Check internal links
        run: pnpm wiki-viewer:check-links

      - name: Build site
        run: hugo --source apps/wiki-viewer --minify

      # why: turn a silent sub-page drop into a red build. The sibling
      # legendary-arena/legendary-arena-lab site 404'd every wiki sub-page in
      # production when a Hugo version/config mismatch silently dropped a content
      # mount, yet `hugo --minify` still exited 0 and CI stayed green. This ewiki
      # has a clean 1:1 mapping — every projected apps/wiki-viewer/content/*.md
      # renders to exactly one apps/wiki-viewer/public/**/index.html — so this
      # step asserts build-time EQUALITY between the projected page count and the
      # rendered page count. Equality (not a static `>= floor`) is deliberate: a
      # floor goes vacuous when a silent drop is masked by an addition and drifts
      # stale-low as the wiki grows, whereas equality fails the instant rendered
      # < projected and needs no maintenance as pages are added.
      - name: Assert wiki pages rendered
        run: |
          set -e
          projected_page_count=$(find apps/wiki-viewer/content -name '*.md' | wc -l | tr -d ' ')
          rendered_page_count=$(find apps/wiki-viewer/public -name 'index.html' | wc -l | tr -d ' ')
          echo "Projected content pages: $projected_page_count; rendered HTML pages: $rendered_page_count."
          if [ "$projected_page_count" -eq 0 ]; then
            echo "Assert wiki pages rendered failed: found zero projected content pages under apps/wiki-viewer/content, so the projection step produced nothing to render — check the 'Project wiki content' step." >&2
            exit 1
          fi
          if [ "$rendered_page_count" -ne "$projected_page_count" ]; then
            echo "Assert wiki pages rendered failed: Hugo rendered $rendered_page_count pages but the projection produced $projected_page_count content pages, so a page silently failed to render (the failure that 404'd every sub-page on the sibling legendary-arena-lab site). Compare apps/wiki-viewer/content/*.md against apps/wiki-viewer/public/**/index.html to find the dropped page." >&2
            exit 1
          fi
          echo "Assert wiki pages rendered passed: all $projected_page_count projected wiki pages rendered to HTML."

      - name: Determinism check (two consecutive builds byte-identical)
        run: |
          set -e
          first_hash=$(find apps/wiki-viewer/public -type f \( -name '*.html' -o -name '*.css' \) -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
          rm -rf apps/wiki-viewer/public
          pnpm wiki-viewer:project
          hugo --source apps/wiki-viewer --minify
          second_hash=$(find apps/wiki-viewer/public -type f \( -name '*.html' -o -name '*.css' \) -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
          if [ "$first_hash" != "$second_hash" ]; then
            echo "Determinism check FAILED: byte-identical output not produced across two consecutive builds." >&2
            echo "First hash:  $first_hash" >&2
            echo "Second hash: $second_hash" >&2
            exit 1
          fi
          echo "Determinism check passed: $first_hash"

      # why: D-24293 — generate the Pagefind static search index into
      # apps/wiki-viewer/public/pagefind/. This MUST run AFTER the determinism
      # check (which hashes only *.html + *.css and re-runs project+hugo WITHOUT
      # Pagefind, so the Pagefind bundle — including pagefind-ui.css — must not
      # exist in the tree when that step samples it) and BEFORE the JS-free gate
      # (which now allow-lists the sanctioned loader). pagefind is a root
      # devDependency installed by the frozen `pnpm install` step above; the
      # same `pnpm exec pagefind --site apps/wiki-viewer/public` invocation runs
      # in render.yaml so the deployed artifact matches this gated one.
      - name: Generate Pagefind search index
        run: pnpm exec pagefind --site apps/wiki-viewer/public

      # why: JS-free-EXCEPT-the-sanctioned-Pagefind-loader (D-24293, amending the
      # D-13808 / D-13811 blanket JS-free invariant). The ewiki stays free of
      # arbitrary and content-authored JavaScript; the ONE permitted script is
      # the chrome-level Pagefind search loader, tagged `data-wiki-search` in
      # apps/wiki-viewer/layouts/_default/baseof.html. Pagefind is a build-time
      # static index (no runtime backend — D-13808 constraint #1 preserved) and
      # the loader is layout chrome, never content-side scripting (D-13808
      # constraint #2 preserved). The scan covers only rendered *.html pages —
      # Pagefind's own /pagefind/*.js bundle is the search engine, not
      # page-authored chrome, and is excluded — and asserts that EVERY <script
      # occurrence is the sanctioned loader. Any other script fails the build red.
      - name: Production output is JS-free except the Pagefind loader
        run: |
          set -e
          total_scripts=$(grep -rho --include='*.html' '<script' apps/wiki-viewer/public | wc -l | tr -d ' ')
          sanctioned_scripts=$(grep -rho --include='*.html' '<script data-wiki-search' apps/wiki-viewer/public | wc -l | tr -d ' ')
          echo "Rendered HTML <script> tags: $total_scripts; sanctioned data-wiki-search loaders: $sanctioned_scripts."
          if [ "$total_scripts" -ne "$sanctioned_scripts" ]; then
            echo "JS-free-except-Pagefind gate FAILED: $total_scripts <script> tag(s) in rendered HTML but only $sanctioned_scripts are the sanctioned data-wiki-search Pagefind loader. Per D-24293 the only permitted script on the ewiki is that loader — remove any other <script>, or keep the data-wiki-search marker if you are extending search." >&2
            exit 1
          fi
          if [ ! -f apps/wiki-viewer/public/pagefind/pagefind-ui.js ]; then
            echo "JS-free-except-Pagefind gate FAILED: apps/wiki-viewer/public/pagefind/pagefind-ui.js is missing — the Pagefind index step did not produce the search bundle. Check the 'Generate Pagefind search index' step." >&2
            exit 1
          fi
          echo "JS-free-except-Pagefind gate passed: all $total_scripts rendered-HTML <script> tag(s) are the sanctioned Pagefind loader, and the Pagefind bundle is present."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiki-viewer-public
          path: apps/wiki-viewer/public/
          retention-days: 7

  # why: deterministic deploy trigger. Render's implicit on-commit auto-deploy
  # for legendary-arena-wiki stalled intermittently (2026-06-11), leaving the
  # live site multiple commits behind main. autoDeploy is now disabled in
  # render.yaml; this job is the single deploy trigger. It runs only on push
  # to main and only after the build job's link-check + Hugo build + JS-free
  # + determinism gates pass, so broken wiki content can never reach the live
  # site. The Render Deploy Hook URL is stored as a repo secret.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_WIKI_DEPLOY_HOOK }}
        run: |
          # why: skip (do not fail) when the secret is absent so the workflow
          # stays green on forks / before the secret is configured. A missing
          # hook means no deploy, which is visible in the live site, not a
          # red CI run.
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "RENDER_WIKI_DEPLOY_HOOK is not set — skipping deploy trigger." >&2
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
          echo "Render deploy triggered for legendary-arena-wiki."
